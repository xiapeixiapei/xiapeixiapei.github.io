<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="site-fonts.js"></script>
  <script src="site-theme.js"></script>
  <script src="site-search.js" defer></script>
  <title>Academic Homepage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+QingKe+HuangYou&family=Pinyon+Script&display=swap" rel="stylesheet">
  <style>
    :root {
    /* Theme tokens (dark values below, under html[data-theme="dark"]) */
    --on-accent: #ffffff; --on-accent-2: #a9c8f0; --ink-2: #334155; --highlight-2: #eaf1fb; --hover-border: #b9cbe3; --card-2: #fbfcfe; --hint: #d3dce7;
    --paper-rgb: 245, 247, 250; --card-rgb: 255, 255, 255; --accent-rgb: 27, 79, 138; --accent-light-rgb: 59, 125, 216; --cover-a: #1b4f8a; --cover-b: #0f3360; --highlight-rgb: 214, 227, 245; --subtle-rgb: 211, 220, 231;
    --warn: #8a5300; --warn-bg: #fcefd6; --ok: #2f7a4f; --ok-bg: #e6f3ea; --ok-border: #b7dcc3; --err: #b42318;
    --note-bg: #c8dbf5; --note-fg: #174a85; --badge-blue: #2f74e0; --gold: #b8860b; --tip-sub: #c9dbf3;
    --map-bg: #e9eef5; --map-ring: #ffffff; --map-dot: #1b4f8a; --map-line: #1b4f8a; --net-node: #9db4d0;
    --ramp-lo: #cfe0f5; --ramp-hi: #0f3360; --map-empty: #e6ebf2; --map-sphere: #f7f9fc; --map-border: #ffffff;
    --font-head: 'Source Serif 4', 'Noto Serif SC', Georgia, serif; --font-body: 'Source Sans 3', 'Noto Sans SC', system-ui, sans-serif;

      --ink: #0d1b2a;
      --paper: #f5f7fa;
      --accent: #1b4f8a;
      --accent-light: #3b7dd8;
      --subtle: #d3dce7;
      --muted: #647387;
      --highlight: #d6e3f5;
      --card-bg: #ffffff;
      --shadow: rgba(13, 27, 42, 0.06);
    }

  /* Dark theme: deep blue-black paper, light ink, a lighter ocean blue for links and accents */
  html[data-theme="dark"] {
    --ink: #e3e9f1; --ink-2: #c5cfdb; --paper: #0e141c; --paper-rgb: 14, 20, 28;
    --accent: #8fb9ef; --accent-light: #6fa3e6; --accent-rgb: 143, 185, 239; --accent-light-rgb: 111, 163, 230; --subtle: #2a3747; --subtle-rgb: 42, 55, 71; --muted: #97a5b7;
    --highlight: #1c2d44; --highlight-rgb: 28, 45, 68; --highlight-2: #172438;
    --card-bg: #151e2a; --card: #151e2a; --card-2: #18222f; --card-rgb: 21, 30, 42; --hint: #53657c; --shadow: rgba(0, 0, 0, 0.35);
    --on-accent: #0b1320; --on-accent-2: #1f3d63; --hover-border: #3d5675;
    --warn: #f0c46a; --warn-bg: #3a2d12; --ok: #7fcf9e; --ok-bg: #16301f; --ok-border: #2f5a3f; --err: #ff8f80; --err-bg: #3d1915;
    --note-bg: #22395a; --note-fg: #b5d0f4; --badge-blue: #3d84ea; --gold: #e0b347; --tip-sub: #475a72;
    --map-bg: #131b25; --map-ring: #0e141c; --map-dot: #8fb9ef; --map-line: #8fb9ef; --net-node: #4a6585;
    --ramp-lo: #1f3049; --ramp-hi: #a9cdf7; --map-empty: #1a2330; --map-sphere: #111923; --map-border: #0e141c;
    color-scheme: dark;
  }
  html[data-theme="dark"] img.logo-on-dark, html[data-theme="dark"] .school-logo { background: #f5f7fa; }


    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-body);
      background: var(--paper);
      color: var(--ink);
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
    }
    body.zh { font-family: var(--font-body); }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      opacity: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 100;
    }

    nav {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 50;
      backdrop-filter: blur(16px);
      background: rgba(var(--paper-rgb), 0.85);
      border-bottom: 1px solid var(--subtle);
      transition: box-shadow 0.3s;
    }
    nav.scrolled { box-shadow: 0 2px 20px var(--shadow); }

    .nav-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      height: 60px;
    }

    .nav-name {
      font-family: var(--font-head);
      font-weight: 600;
      font-size: 1.438rem;
      letter-spacing: 0.02em;
      color: var(--accent);
      transition: opacity 0.25s;
    }
    .nav-name:hover { opacity: 0.7; }
    .nav-name { white-space: nowrap; flex-shrink: 0; }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 1.1rem;
    }
    /* Phones: room for the theme button next to the globe, lock and EN / 中 */
    @media (max-width: 520px) {
      .nav-inner { padding: 0 14px; gap: 0.6rem; }
      .nav-right { gap: 0.55rem; }
    }

    .nav-links { display: flex; align-items: center; gap: 1.15rem; }
    .hamburger { display: none; }

    .nav-links a {
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      transition: color 0.25s;
      position: relative;
    }
    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 0;
      height: 1.5px;
      background: var(--accent);
      transition: width 0.3s ease;
    }
    .nav-links a:hover { color: var(--accent); }
    .nav-links a:hover::after { width: 100%; }

    .nav-pub {
      background: var(--accent) !important;
      color: var(--on-accent) !important;
      padding: 0.35rem 0.9rem !important;
      border-radius: 100px;
      text-transform: uppercase;
      font-size: 1.025rem !important;
      letter-spacing: 0.04em;
      transition: all 0.25s;
    }
    .nav-pub::after { display: none !important; }
    .nav-pub:hover {
      background: var(--accent-light) !important;
      color: var(--on-accent) !important;
      transform: translateY(-1px);
    }

    /* ── Language Toggle ── */
    .lang-toggle {
      display: flex;
      align-items: center;
      border: 1px solid var(--subtle);
      border-radius: 100px;
      overflow: hidden;
      background: var(--card-bg);
      flex-shrink: 0;
    }
    .lang-btn {
      padding: 0.3rem 0.7rem;
      font-size: 0.938rem;
      font-weight: 600;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.25s;
      letter-spacing: 0.03em;
    }
    .lang-btn.active {
      background: var(--accent);
      color: var(--on-accent);
    }

    .hero {
      max-width: 1100px;
      margin: 0 auto;
      padding: 90px 2rem 28px;
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 3.5rem;
      align-items: stretch;
    }

    .avatar-wrapper {
      position: relative;
      height: 100%;
      animation: fadeSlideUp 0.8s ease both;
    }

    .avatar {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 340px;
      max-height: 460px;
      border-radius: 8px;
      object-fit: cover;
      object-position: 50% 50%;
      background: var(--subtle);
      border: 1px solid var(--subtle);
    }

    .avatar-decorator {
      position: absolute;
      top: -8px;
      left: -8px;
      width: 60px;
      height: 60px;
      border-left: 2px solid var(--accent-light);
      border-top: 2px solid var(--accent-light);
      border-radius: 4px 0 0 0;
      opacity: 0.5;
    }

    .hero-text {
      padding-top: 0;
      animation: fadeSlideUp 0.8s ease 0.15s both;
    }

    .hero-text h1 {
      font-family: var(--font-head);
      font-size: 2.912rem;
      font-weight: 300;
      line-height: 1.2;
      margin-bottom: 0.5rem;
      color: var(--ink);
      letter-spacing: -0.01em;
    }

    .affiliation {
      font-size: 1.188rem;
      color: var(--accent);
      font-weight: 500;
      margin-bottom: 1.5rem;
    }

    .bio {
      font-size: 1.225rem;
      color: var(--ink-2);
      line-height: 1.85;
      max-width: 680px;
    }

    .contact-row {
      margin-top: 1.8rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .contact-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 1.1rem;
      border: 1px solid var(--subtle);
      border-radius: 6px;
      font-size: 1.025rem;
      font-weight: 500;
      color: var(--ink);
      text-decoration: none;
      background: var(--card-bg);
      transition: all 0.25s;
      letter-spacing: 0.02em;
    }
    .contact-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px var(--shadow);
    }
    .contact-btn svg { width: 15px; height: 15px; opacity: 0.7; }
    .contact-row { align-items: stretch; }
    .contact-btn.icon-btn {
      position: relative;
      justify-content: center;
      width: 48px;
      min-height: 46px;
      padding: 0;
    }
    .contact-btn.icon-btn svg { width: 22px; height: 22px; opacity: 0.85; }
    .contact-btn.icon-btn:hover svg, .contact-btn.icon-btn:focus-visible svg { opacity: 1; }
    /* Name bubble shown above the icon on hover / keyboard focus */
    .contact-btn.icon-btn::after {
      content: attr(data-tip);
      position: absolute;
      bottom: calc(100% + 10px);
      left: 50%;
      transform: translate(-50%, 4px);
      background: var(--ink);
      color: var(--paper);
      font-size: 0.85rem;
      font-weight: 500;
      line-height: 1;
      padding: 0.45rem 0.7rem;
      border-radius: 6px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
      z-index: 5;
    }
    .contact-btn.icon-btn::before {
      content: '';
      position: absolute;
      bottom: calc(100% + 4px);
      left: 50%;
      transform: translate(-50%, 4px);
      border: 6px solid transparent;
      border-top-color: var(--ink);
      border-bottom: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
      z-index: 5;
    }
    .contact-btn.icon-btn:hover::after, .contact-btn.icon-btn:focus-visible::after,
    .contact-btn.icon-btn:hover::before, .contact-btn.icon-btn:focus-visible::before {
      opacity: 1;
      transform: translate(-50%, 0);
    }
    @media (prefers-reduced-motion: reduce) {
      .contact-btn.icon-btn::after, .contact-btn.icon-btn::before { transition: none; }
    }

    section {
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 2rem;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.6rem;
    }

    .section-header h2 {
      font-family: var(--font-head);
      font-size: 1.792rem;
      font-weight: 400;
      color: var(--ink);
      white-space: nowrap;
    }
    body.zh .section-header h2 { font-family: var(--font-head); }

    .section-header::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, var(--subtle), transparent);
    }

    .research-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .tag {
      padding: 0.55rem 1.3rem;
      background: var(--highlight);
      border-radius: 100px;
      font-size: 1.1rem;
      color: var(--accent);
      font-weight: 500;
      border: 1px solid transparent;
      transition: all 0.25s;
    }
    .tag:hover {
      border-color: var(--accent-light);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px var(--shadow);
    }

    .timeline {
      position: relative;
      padding-left: 28px;
    }
    .timeline::before {
      content: '';
      position: absolute;
      left: 6px;
      top: 8px;
      bottom: 8px;
      width: 1.5px;
      background: linear-gradient(to bottom, var(--accent-light), var(--subtle));
    }

    .timeline-item {
      position: relative;
      padding-bottom: 1.3rem;
    }
    .timeline-item:last-child { padding-bottom: 0; }
    .timeline-item::before {
      content: '';
      position: absolute;
      left: -25px;
      top: 7px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--paper);
      border: 2px solid var(--accent-light);
      z-index: 1;
    }
    .timeline-item:first-child::before {
      background: var(--accent);
      border-color: var(--accent);
    }

    .timeline-period {
      font-family: var(--font-head);
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 0.2rem;
    }
    .timeline-degree {
      font-size: 1.188rem;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 0.15rem;
    }
    .timeline-school {
      font-size: 1.1rem;
      color: var(--muted);
      margin-bottom: 0.3rem;
    }
    .timeline-detail {
      font-size: 1.037rem;
      color: var(--muted);
      font-style: italic;
    }

    .timeline-item-inner {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
    }
    .school-logo-wrap {
      position: relative;
      width: 72px;
      height: 72px;
      flex-shrink: 0;
      cursor: pointer;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 2px;
    }
    .school-logo {
      width: 72px;
      height: 72px;
      border-radius: 10px;
      object-fit: contain;
      background: transparent;
      border: 1px solid var(--subtle);
      padding: 6px;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      display: block;
    }
    .school-logo-wrap:hover .school-logo {
      transform: scale(1.08);
      box-shadow: 0 8px 24px rgba(var(--accent-rgb), 0.18);
      border-color: var(--accent-light);
    }
    .school-logo-wrap .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(var(--accent-rgb), 0.25);
      transform: scale(0);
      animation: rippleAnim 0.55s linear;
      pointer-events: none;
    }
    @keyframes rippleAnim {
      to { transform: scale(4); opacity: 0; }
    }

    .pub-year {
      font-family: var(--font-head);
      font-size: 1.438rem;
      font-weight: 600;
      color: var(--accent);
      margin-top: 1.2rem;
      margin-bottom: 0.7rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px dashed var(--subtle);
    }
    .pub-year:first-child { margin-top: 0; }

    .pub-item {
      padding: 1.3rem 1.6rem;
      margin-bottom: 1rem;
      background: var(--card-bg);
      border-radius: 8px;
      border: 1px solid transparent;
      transition: all 0.3s;
    }
    .pub-item:hover {
      border-color: var(--subtle);
      box-shadow: 0 6px 24px var(--shadow);
      transform: translateY(-2px);
    }

    .pub-item .pub-title {
      font-weight: 600;
      font-size: 1.225rem;
      color: var(--ink);
      margin-bottom: 0.35rem;
      line-height: 1.5;
    }
    .pub-item .pub-authors {
      font-size: 1.087rem;
      color: var(--muted);
      margin-bottom: 0.25rem;
    }
    .pub-item .pub-authors strong {
      color: var(--accent);
      font-weight: 600;
    }
    .pub-item .pub-venue {
      font-size: 1.062rem;
      font-style: italic;
      color: var(--accent-light);
    }

    .pub-badge {
      display: inline-block;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.15rem 0.55rem;
      border-radius: 4px;
      margin-left: 0.5rem;
      vertical-align: middle;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .badge-first { background: var(--badge-blue); color: var(--on-accent); }
    .badge-corr { background: var(--card-bg); color: var(--badge-blue); box-shadow: inset 0 0 0 1.5px var(--badge-blue); }
    .badge-review { background: var(--warn-bg); color: var(--warn); }

    .pub-links {
      margin-top: 0.7rem;
      display: flex;
      gap: 0.6rem;
    }
    .pub-link {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.975rem;
      padding: 0.35rem 0.85rem;
      border-radius: 5px;
      text-decoration: none;
      background: var(--accent); color: var(--on-accent); border: 1.5px solid var(--accent); font-weight: 600;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .pub-link::after { content: '↗'; font-size: 0.95em; line-height: 1; }
    .pub-link:hover, .pub-link:focus-visible {
      background: var(--card-bg); color: var(--accent); border-color: var(--accent); box-shadow: 0 4px 12px rgba(var(--accent-rgb), 0.2);
    }

    /* ── View All Button ── */
    .view-all-btn {
      display: block;
      text-align: center;
      padding: 0.8rem 1.5rem;
      margin: 0 0 2rem;
      background: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 8px;
      color: var(--on-accent);
      font-size: 1.125rem;
      font-weight: 600;
      text-decoration: none;
      letter-spacing: 0.02em;
      transition: all 0.25s;
    }
    .view-all-btn:hover, .view-all-btn:focus-visible {
      border-color: var(--accent);
      background: var(--card-bg);
      color: var(--accent);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(var(--accent-rgb), 0.18);
    }

    /* ── Collapsible Year Sections ── */
    .collapsible-section {
      margin-bottom: 0.5rem;
    }
    .year-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 0.7rem 1.2rem;
      background: var(--highlight);
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      font-family: var(--font-head);
      font-size: 1.375rem;
      font-weight: 600;
      color: var(--accent);
      transition: all 0.2s;
    }
    .year-toggle:hover {
      border-color: var(--subtle);
      background: var(--card-bg);
    }
    .toggle-icon {
      font-size: 1.062rem;
      transition: transform 0.25s;
    }
    .year-toggle.open .toggle-icon {
      transform: rotate(90deg);
    }
    .year-content {
      padding: 0.5rem 0 0;
    }

    .photo-carousel {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 2rem;
      position: relative;
    }
    .photo-carousel .slides {
      width: 100%;
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      background: var(--ink);
    }
    .photo-carousel .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    .photo-carousel .slide.active { opacity: 1; z-index: 1; }
    .photo-carousel .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      filter: brightness(0.88);
    }
    .photo-carousel .photo-caption {
      position: absolute;
      bottom: 12px;
      right: 16px;
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.75);
      font-style: italic;
      letter-spacing: 0.03em;
      text-shadow: 0 1px 4px rgba(0,0,0,0.5);
      transition: opacity 0.5s;
      z-index: 2;
    }
    .carousel-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.25);
      backdrop-filter: blur(4px);
      color: #fff;
      font-size: 1.375rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s;
      opacity: 0;
      z-index: 3;
    }
    .photo-carousel:hover .carousel-nav { opacity: 1; }
    .carousel-nav:hover { background: rgba(255,255,255,0.45); }
    .carousel-nav.prev { left: calc(2rem + 10px); }
    .carousel-nav.next { right: calc(2rem + 10px); }
    .carousel-dots {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      z-index: 2;
    }
    .carousel-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.4);
      border: none;
      cursor: pointer;
      padding: 0;
      transition: all 0.25s;
    }
    .carousel-dot.active {

  // ── Section renderers ──
  function renderHero(p) {
    const aff = T(p.affiliation), bio = T(p.bio);
    const links = (p.links || []).map(l =>
      `<a class="contact-btn icon-btn" href="${attr(l.url)}" target="_blank" rel="noopener" aria-label="${attr(l.label)}" data-tip="${attr(l.label)}" data-tip-en="${attr(l.label)}" data-tip-zh="${attr(l.label)}">${ICONS[l.icon] || ICONS.other}</a>`).join('');
    // Email is obfuscated: assembled on click, never present in the static HTML
    const emailParts = JSON.stringify((p.email || '').split('@'));
    const emailBtn = p.email ? `<a class="contact-btn icon-btn" href="#" aria-label="Email" data-tip="Email" data-tip-en="Email" data-tip-zh="邮箱" onclick="this.href='mai'+'lto:'+${attr(emailParts)}.join('@'); return true;">${ICONS.email}</a>` : '';
    document.getElementById('about').innerHTML = `
      <div class="avatar-wrapper">
        <div class="avatar-decorator"></div>
        <img class="avatar" src="${attr(p.photo)}" alt="${attr(p.name_en)}">
      </div>
      <div class="hero-text">
        <h1>${esc(p.name_en)} <span style="font-family: 'Ma Shan Zheng', cursive; font-weight: 400; font-size: 2.464rem; color: var(--accent); margin-left: 0.4rem;">${esc(p.name_zh)}</span></h1>
        ${bi('div', aff.en, aff.zh, 'affiliation')}
        ${bi('p', bio.en, bio.zh, 'bio')}
        <div class="contact-row">
          ${emailBtn}${links}
          <button class="contact-btn like-btn" id="likeBtn" onclick="handleLike()">
            <span class="heart">&#128077;</span>
            <span id="likeText" data-en="Like" data-zh="点赞">Like</span>
            <span id="likeCount">0</span>
          </button>
        </div>
      </div>`;
    document.getElementById('nav-name').textContent = p.name_en;
  }

  function renderResearch(list) {
    document.getElementById('research-tags').innerHTML = list.map(t => { const x = T(t); return bi('span', x.en, x.zh, 'tag'); }).join('');
  }

  function renderEducation(list) {
    const linkStyle = "color:var(--accent);text-decoration:none;border-bottom:1px dashed var(--subtle)";
    document.getElementById('education-timeline').innerHTML = list.map(e => {
      const deg = T(e.degree), sch = T(e.school);
      let detail = '';
      if (e.supervisors && e.supervisors.length) {
        const a = (s, lang) => `<a href='${attr(s.url)}' target='_blank' style='${linkStyle}'>${esc(s[lang] || s.en)}</a>`;
        const en = 'Supervised by ' + e.supervisors.map(s => 'Prof. ' + a(s, 'en')).join(' &amp; ');
        const zh = '导师：' + e.supervisors.map(s => a(s, 'zh') + ' 教授').join('、');
        detail = bi('div', en, zh, 'timeline-detail');
      }
      return `<div class="timeline-item"><div class="timeline-item-inner">
        <div class="school-logo-wrap" onclick="logoRipple(event)" title="${attr(e.logo_title)}"><img class="school-logo" src="${attr(e.logo)}" alt="${attr(e.logo_title)}" onerror="this.parentNode.style.visibility='hidden'"></div>
        <div>
          <div class="timeline-period">${esc(e.period)}</div>
          ${bi('div', deg.en, deg.zh, 'timeline-degree')}
          ${bi('div', sch.en, sch.zh, 'timeline-school')}
          ${detail}
        </div></div></div>`;
    }).join('');
  }

  function renderCarousel(id, slides) {
    const credit = T(CONTENT.site.photo_credit);
    const sep = ' &nbsp;&middot;&nbsp; ';
    document.getElementById(id).innerHTML = `<div class="slides">${slides.map((s, i) => {
      const c = T(s.caption);
      return `<div class="slide${i === 0 ? ' active' : ''}"><img src="${attr(s.src)}" alt="${attr(s.caption?.en || '')}"${i > 0 ? ' loading="lazy"' : ''}>${bi('span', c.en + sep + credit.en, c.zh + sep + credit.zh, 'photo-caption')}</div>`;
    }).join('')}</div>
      <button class="carousel-nav prev" onclick="slideCarousel('${id}',-1)">&#10094;</button>
      <button class="carousel-nav next" onclick="slideCarousel('${id}',1)">&#10095;</button>
      <div class="carousel-dots"></div>`;
  }

  function pubBadges(p) {
    let b = '';
    if (p.first_author) b += ' <span class="pub-badge badge-first">First Author</span>';
    if (p.corresponding) b += ' <span class="pub-badge badge-corr">Corresponding Author</span>';
    if (p.status) b += ` <span class="pub-badge badge-review">${esc(p.status)}</span>`;
    return b;
  }
  function pubItem(p, style = '') {
    const link = p.url ? `<div class="pub-links"><a class="pub-link" href="${attr(p.url)}" target="_blank" data-en="Read in publisher" data-zh="阅读原文">Read in publisher</a></div>` : '';
    return `<div class="pub-item"${style ? ` style="${style}"` : ''}>
      <div class="pub-title">${esc(p.title_short || p.title)}${pubBadges(p)}</div>
      <div class="pub-authors">${p.authors}</div>
      <div class="pub-venue">${esc(p.venue)}</div>${link}</div>`;
  }
  function renderPublications(pubs) {
    const featured = pubs.filter(p => p.featured);
    document.getElementById('pub-featured').innerHTML = featured.length ? `<div style="margin-bottom:1.5rem;">
      ${bi('div', '⭐ Featured', '⭐ 代表性成果', '', '', 'font-size:1.025rem;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--accent);margin-bottom:0.8rem;')}
      ${featured.map(p => pubItem(p, 'border:1px solid var(--accent-light);background:linear-gradient(135deg, var(--highlight) 0%, var(--highlight-2) 100%);')).join('')}</div>` : '';
    // Group by year, newest first, books last
    const groups = {};
    pubs.forEach(p => { (groups[p.year] = groups[p.year] || []).push(p); });
    const years = Object.keys(groups).filter(y => y !== 'book').sort((a, b) => b.localeCompare(a));
    if (groups.book) years.push('book');
    document.getElementById('pub-years').innerHTML = years.map(y => `<div class="collapsible-section">
      <button class="year-toggle" onclick="toggleYear(this)">${y === 'book' ? '<span data-en="Book" data-zh="著作">Book</span>' : `<span>${esc(y)}</span>`}<span class="toggle-icon">▸</span></button>
      <div class="year-content" style="display:none;">${groups[y].map(p => pubItem(p)).join('')}</div></div>`).join('');
  }

  function renderAwards(list) {
    document.getElementById('awards-list').innerHTML = list.map(a => {
      const t = T(a.text);
      const note = a.note ? ` <span class="award-note">${esc(a.note)}</span>` : '';
      return `<div class="award-item${a.highlight ? ' highlight-award' : ''}"><span class="award-year">${esc(a.year)}</span>${bi('span', t.en, t.zh, 'award-text', note)}</div>`;
    }).join('');
  }

  function renderCV(cv) {
    const u = T(cv.updated);
    document.getElementById('cv-card').innerHTML = `<div class="cv-info">
        <h3 data-en="Full CV" data-zh="完整简历">Full CV</h3>${bi('p', u.en, u.zh)}</div>
      <a class="cv-download" href="${attr(encodeURI(cv.file))}" download>
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        <span data-en="Download PDF" data-zh="下载 PDF">Download PDF</span></a>`;
  }

  function renderFooter(site) {
    document.getElementById('footer').innerHTML = `<p>&copy; ${esc(site.footer_year)} ${esc(CONTENT.profile.name_en)} &nbsp;&middot;&nbsp; Hosted on <a href="https://pages.github.com/" target="_blank">GitHub Pages</a> &nbsp;&middot;&nbsp; <a href="admin.html" rel="nofollow" class="admin-link" title="Site Manager">Admin</a></p>`;
  }

  // Inject Google Analytics if an ID is set in content.json (site.ga_id)
  function injectGA(id) {
    if (!id || !/^G-[A-Z0-9]+$/i.test(id)) return;
    window.dataLayer = window.dataLayer || [];
    window.gtag = function () { dataLayer.push(arguments); };
    gtag('js', new Date()); gtag('config', id);
    const s = document.createElement('script'); s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(id);
    document.head.appendChild(s);
  }

  // Inject GoatCounter if a site code is configured (privacy-friendly analytics)
  function injectGoatCounter(code) {
    if (!code) return;
    const s = document.createElement('script');
    s.async = true;
    s.dataset.goatcounter = `https://${code}.goatcounter.com/count`;
    s.src = '//gc.zgo.at/count.js';
    document.head.appendChild(s);
  }

  // ── Language Toggle ──
  function applyLang(lang) {
    document.querySelectorAll('[data-tip-en]').forEach(el => {
      const t = el.getAttribute('data-tip-' + lang) || el.getAttribute('data-tip-en');
      el.setAttribute('data-tip', t); el.setAttribute('aria-label', t);
      if (el.hasAttribute('title')) el.setAttribute('title', t);
    });
    currentLang = lang;
    document.querySelectorAll('#lang-toggle .lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
    document.body.classList.toggle('zh', lang === 'zh');
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    document.querySelectorAll('[data-en][data-zh]').forEach(el => {
      // Preserve child elements like .award-note and .pub-badge
      const notes = el.querySelectorAll('.award-note, .pub-badge');
      let preserved = '';
      notes.forEach(n => { preserved += ' ' + n.outerHTML; });
      el.innerHTML = el.getAttribute('data-' + lang) + preserved;
    });
    if (CONTENT) document.title = CONTENT.site.title[lang] || CONTENT.site.title.en;
  }
  document.getElementById('lang-toggle').addEventListener('click', (e) => {
    const btn = e.target.closest('.lang-btn');
    if (!btn || btn.dataset.lang === currentLang) return;
    applyLang(btn.dataset.lang);
  });

  // ── Boot ──
  async function boot() {
    try {
      const res = await fetch('content.json', { cache: 'no-cache' });
      if (!res.ok) throw new Error(res.status);
      CONTENT = await res.json();
    } catch (err) {
      document.getElementById('about').innerHTML = `<p style="grid-column:1/-1;color:var(--muted)">Failed to load content.json (${esc(err.message)}).</p>`;
      return;
    }
    renderHero(CONTENT.profile);
    renderResearch(CONTENT.research_interests || []);
    renderEducation(CONTENT.education || []);
    renderCarousel('carousel1', (CONTENT.carousels || [])[0] || []);
    renderCarousel('carousel2', (CONTENT.carousels || [])[1] || []);
    renderPublications(CONTENT.publications || []);
    renderAwards(CONTENT.awards || []);
    renderCV(CONTENT.cv || {});
    renderFooter(CONTENT.site || {});
    injectGoatCounter(CONTENT.site?.goatcounter_code);
    injectGA(CONTENT.site?.ga_id);
    applyLang(currentLang);
    initLike();
    initCarousel('carousel1');
    initCarousel('carousel2');
    initNetworkWhenVisible();
    const hideIfEmpty = (id, empty) => { if (!empty) return; const s = document.getElementById(id); if (s) s.style.display = 'none';
      document.querySelectorAll(`#nav-links a[href="#${id}"]`).forEach(a => a.style.display = 'none'); };
    hideIfEmpty('research', !(CONTENT.research_interests || []).length);
    hideIfEmpty('education', !(CONTENT.education || []).length);
    hideIfEmpty('awards', !(CONTENT.awards || []).length);
    hideIfEmpty('cv', !CONTENT.cv?.file);
    hideIfEmpty('network', (CONTENT.publications || []).length < 2);
  }

  // ── Nav scroll shadow ──
  window.addEventListener('scroll', () => {
    document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 10);
  });

  // ── Fade-in on scroll ──
  const fadeObserver = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
  }, { threshold: 0.15 });
  document.querySelectorAll('.fade-in').forEach(el => fadeObserver.observe(el));

  // ── Hamburger menu toggle ──
  const hamburger = document.getElementById('hamburger');
  const navLinks = document.getElementById('nav-links');
  hamburger.addEventListener('click', () => {
    hamburger.classList.toggle('active');
    navLinks.classList.toggle('open');
  });
  navLinks.querySelectorAll('a').forEach(link => {
    link.addEventListener('click', () => {
      hamburger.classList.remove('active');
      navLinks.classList.remove('open');
    });
  });

  // ── Collapsible Year Sections ──
  function toggleYear(btn) {
    btn.classList.toggle('open');
    const content = btn.nextElementSibling;
    content.style.display = content.style.display === 'none' ? 'block' : 'none';
  }
  window.toggleYear = toggleYear;

  // ── School Logo Ripple ──
  function logoRipple(e) {
    const wrap = e.currentTarget;
    const ripple = document.createElement('span');
    ripple.className = 'ripple';
    const size = Math.max(wrap.offsetWidth, wrap.offsetHeight);
    const rect = wrap.getBoundingClientRect();
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
    ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
    wrap.appendChild(ripple);
    ripple.addEventListener('animationend', () => ripple.remove());
  }

  // ── Like Button (CountAPI for global count + localStorage to prevent repeat likes) ──
  const LIKE_API = 'https://countapi.mileshilliard.com/api/v1';
  const LIKE_KEY = ('likes-' + location.hostname + '-' + (location.pathname.split('/').filter(Boolean)[0] || '')).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/-+$/, '');
  let hasLiked = false;
  function initLike() {
    try { hasLiked = localStorage.getItem('hasLiked') === 'true'; } catch (e) {}
    if (hasLiked) document.getElementById('likeBtn').classList.add('liked');
    loadLikeCount();
  }
  async function loadLikeCount() {
    const el = document.getElementById('likeCount');
    try {
      const res = await fetch(LIKE_API + '/get/' + LIKE_KEY);
      if (res.ok) { const data = await res.json(); el.textContent = data.value || 0; }
    } catch (e) {
      try { el.textContent = localStorage.getItem('likeCountLocal') || '0'; } catch (_) {}
    }
  }
  async function handleLike() {
    if (hasLiked) return;
    hasLiked = true;
    try { localStorage.setItem('hasLiked', 'true'); } catch (e) {}
    document.getElementById('likeBtn').classList.add('liked');
    const el = document.getElementById('likeCount');
    try {
      const res = await fetch(LIKE_API + '/hit/' + LIKE_KEY);
      if (res.ok) { const data = await res.json(); el.textContent = data.value; try { localStorage.setItem('likeCountLocal', data.value); } catch (_) {} }
    } catch (e) {
      let local = 0; try { local = parseInt(localStorage.getItem('likeCountLocal') || '0') + 1; localStorage.setItem('likeCountLocal', local); } catch (_) {}
      el.textContent = local;
    }
    const toast = document.getElementById('toast');
    toast.textContent = currentLang === 'zh' ? '感谢您的支持！' : 'Thank you for your support!';
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
  }

  // ── Photo Carousels ──
  const carousels = {};
  const autoplayInterval = 5000;
  function initCarousel(id) {
    const el = document.getElementById(id);
    const slides = el.querySelectorAll('.slide');
    if (!slides.length) { el.style.display = 'none'; return; }
    const dotsContainer = el.querySelector('.carousel-dots');
    slides.forEach((_, i) => {
      const dot = document.createElement('button');
      dot.className = 'carousel-dot' + (i === 0 ? ' active' : '');
      dot.onclick = () => goToSlide(id, i);
      dotsContainer.appendChild(dot);
    });
    carousels[id] = {
      el, slides, current: 0,
      dots: dotsContainer.querySelectorAll('.carousel-dot'),
      timer: setInterval(() => slideCarousel(id, 1), autoplayInterval)
    };
    el.addEventListener('mouseenter', () => clearInterval(carousels[id].timer));
    el.addEventListener('mouseleave', () => {
      carousels[id].timer = setInterval(() => slideCarousel(id, 1), autoplayInterval);
    });
  }
  function goToSlide(id, index) {
    const c = carousels[id];
    c.slides[c.current].classList.remove('active');
    c.dots[c.current].classList.remove('active');
    c.current = index;
    c.slides[c.current].classList.add('active');
    c.dots[c.current].classList.add('active');
  }
  function slideCarousel(id, dir) {
    const c = carousels[id];
    if (!c) return;
    goToSlide(id, (c.current + dir + c.slides.length) % c.slides.length);
  }

  // ── Collaboration Network (D3.js), derived from publication author lists ──
  function authorsOf(p) {
    const tmp = document.createElement('div');
    tmp.innerHTML = p.authors || '';
    return tmp.textContent.split(',').map(s => s.replace(/\*/g, '').trim()).filter(Boolean);
  }
  function initNetworkWhenVisible() {
    const container = document.getElementById('network-container');
    let initialized = false;
    const obs = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting && !initialized) {
        initialized = true;
        obs.disconnect();
        initNetwork();
      }
    }, { threshold: 0.1 });
    obs.observe(container);
  }
  function initNetwork() {
    const ME = CONTENT.site.me_author || '';
    const papers = (CONTENT.publications || []).map(p => ({ authors: authorsOf(p) }));

    const coauthorCount = {};
    const linkMap = {};
    papers.forEach(p => {
      p.authors.forEach(a => { coauthorCount[a] = (coauthorCount[a] || 0) + 1; });
      for (let i = 0; i < p.authors.length; i++) {
        for (let j = i + 1; j < p.authors.length; j++) {
          const key = [p.authors[i], p.authors[j]].sort().join('|');
          linkMap[key] = (linkMap[key] || 0) + 1;
        }
      }
    });
    // The most frequent co-author (other than me) gets the secondary colour
    const top = Object.entries(coauthorCount).filter(([n]) => n !== ME).sort((a, b) => b[1] - a[1])[0]?.[0];
    const nodes = Object.entries(coauthorCount).map(([name, count]) => ({
      id: name, count, isMe: name === ME, group: name === ME ? 0 : name === top ? 1 : 2
    }));
    const links = Object.entries(linkMap).map(([key, value]) => {
      const [s, t] = key.split('|');
      return { source: s, target: t, value };
    });

    const container = document.getElementById('network-container');
    const svg = document.getElementById('network-svg');
    const rect = container.getBoundingClientRect();
    const W = rect.width, H = rect.height;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    const accent = 'var(--accent)', accentLight = 'var(--accent-light)', muted = 'var(--muted)';

    const sim = d3.forceSimulation(nodes)
      .force('link', d3.forceLink(links).id(d => d.id).distance(d => 160 - d.value * 8).strength(0.4))
      .force('charge', d3.forceManyBody().strength(-500))
      .force('center', d3.forceCenter(W / 2, H / 2))
      .force('collision', d3.forceCollide().radius(d => nodeR(d) + 14))
      .force('x', d3.forceX(W / 2).strength(0.04))
      .force('y', d3.forceY(H / 2).strength(0.04));
    function nodeR(d) { return d.isMe ? 34 : Math.max(12, Math.sqrt(d.count) * 10); }

    const svgSel = d3.select('#network-svg');
    const link = svgSel.selectAll('line').data(links).enter().append('line')
      .style('stroke', 'var(--subtle)').attr('stroke-width', d => Math.max(1, d.value * 1.2)).attr('stroke-opacity', 0.6);
    const node = svgSel.selectAll('g.node').data(nodes).enter().append('g').attr('class', 'node').style('cursor', 'grab')
      .call(d3.drag()
        .on('start', (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
        .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; })
        .on('end', (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));
    const tip = document.getElementById('network-tooltip');
    node.append('circle')
      .attr('r', d => nodeR(d))
      .style('fill', d => d.isMe ? accent : d.group === 1 ? accentLight : 'var(--net-node)')
      .style('stroke', d => d.isMe ? 'var(--ink)' : 'transparent')
      .attr('stroke-width', d => d.isMe ? 2.5 : 0)
      .attr('opacity', 0.9)
      .on('mouseover', function (e, d) {
        d3.select(this).transition().duration(200).attr('opacity', 1).attr('r', nodeR(d) * 1.2);
        tip.textContent = currentLang === 'zh' ? `${d.id} · 合作论文 ${d.count} 篇` : `${d.id} · ${d.count} paper${d.count > 1 ? 's' : ''}`;
        tip.style.display = 'block';
        const r = container.getBoundingClientRect();
        tip.style.left = (e.clientX - r.left + 12) + 'px'; tip.style.top = (e.clientY - r.top - 30) + 'px';
      })
      .on('mousemove', function (e) {
        const r = container.getBoundingClientRect();
        tip.style.left = (e.clientX - r.left + 12) + 'px'; tip.style.top = (e.clientY - r.top - 30) + 'px';
      })
      .on('mouseout', function (e, d) {
        d3.select(this).transition().duration(200).attr('opacity', 0.9).attr('r', nodeR(d));
        tip.style.display = 'none';
      });
    node.append('text').text(d => d.id.replace('.', '')).attr('text-anchor', 'middle').attr('dy', d => nodeR(d) + 14)
      .attr('font-size', d => d.isMe ? '14px' : '11px').attr('font-weight', d => d.isMe ? '700' : '500')
      .style('fill', d => d.isMe ? accent : muted).style('font-family', 'var(--font-body)');
    node.filter(d => d.isMe || d.count >= 3).append('text').text(d => d.count).attr('text-anchor', 'middle').attr('dy', '0.35em')
      .attr('font-size', d => d.isMe ? '15px' : '11px').attr('font-weight', '700').style('fill', 'var(--on-accent)').style('font-family', 'var(--font-body)');
    sim.on('tick', () => {
      link.attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y);
      node.attr('transform', d => `translate(${d.x},${d.y})`);
    });
  }

  boot();
</script>
</body>
