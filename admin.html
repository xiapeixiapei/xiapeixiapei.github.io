<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="site-fonts.js"></script>
<script src="site-theme.js"></script>
<script src="city-icons.js"></script>
<script src="aviation.js"></script>
<meta name="robots" content="noindex, nofollow">
<title>Site Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  /* Layout: fixed left rail with sections, scrolling main pane; same palette as the public site */
  :root {
    /* Theme tokens (dark values below, under html[data-theme="dark"]) */
    --on-accent: #ffffff; --on-accent-2: #a9c8f0; --ink-2: #334155; --highlight-2: #eaf1fb; --hover-border: #b9cbe3; --card-2: #fbfcfe; --hint: #d3dce7;
    --paper-rgb: 245, 247, 250; --card-rgb: 255, 255, 255; --accent-rgb: 27, 79, 138; --accent-light-rgb: 59, 125, 216; --cover-a: #1b4f8a; --cover-b: #0f3360; --highlight-rgb: 214, 227, 245; --subtle-rgb: 211, 220, 231;
    --warn: #8a5300; --warn-bg: #fcefd6; --ok: #2f7a4f; --ok-bg: #e6f3ea; --ok-border: #b7dcc3; --err: #b42318;
    --note-bg: #c8dbf5; --note-fg: #174a85; --badge-blue: #2f74e0; --gold: #b8860b; --tip-sub: #c9dbf3;
    --map-bg: #e9eef5; --map-ring: #ffffff; --map-dot: #1b4f8a; --map-line: #1b4f8a; --net-node: #9db4d0;
    --ramp-lo: #cfe0f5; --ramp-hi: #0f3360; --map-empty: #e6ebf2; --map-sphere: #f7f9fc; --map-border: #ffffff;
    --font-head: 'Source Serif 4', 'Noto Serif SC', Georgia, serif; --font-body: 'Source Sans 3', 'Noto Sans SC', system-ui, sans-serif;

    --ink: #0d1b2a; --paper: #f5f7fa; --accent: #1b4f8a; --accent-light: #3b7dd8;
    --subtle: #d3dce7; --muted: #647387; --highlight: #d6e3f5; --card: #ffffff;
    --ok: #2f7a4f; --ok-bg: #e6f3ea; --warn: #8a5300; --warn-bg: #fcefd6; --err: #b42318; --err-bg: #fde8e6;
    --shadow: rgba(13, 27, 42, 0.06);
    --serif: 'Crimson Pro', Georgia, serif; --sans: 'DM Sans', system-ui, sans-serif; --mono: 'DM Mono', ui-monospace, monospace;
  }

  /* Dark theme: deep blue-black paper, light ink, a lighter ocean blue for links and accents */
  html[data-theme="dark"] {
    --ink: #e3e9f1; --ink-2: #c5cfdb; --paper: #0e141c; --paper-rgb: 14, 20, 28;
    --accent: #8fb9ef; --accent-light: #6fa3e6; --accent-rgb: 143, 185, 239; --accent-light-rgb: 111, 163, 230; --subtle: #2a3747; --subtle-rgb: 42, 55, 71; --muted: #97a5b7;
    --highlight: #1c2d44; --highlight-rgb: 28, 45, 68; --highlight-2: #172438;
    --card-bg: #151e2a; --card: #151e2a; --card-2: #18222f; --card-rgb: 21, 30, 42; --hint: #53657c; --shadow: rgba(0, 0, 0, 0.35);
    --on-accent: #0b1320; --on-accent-2: #1f3d63; --hover-border: #3d5675;
    --warn: #f0c46a; --warn-bg: #3a2d12; --ok: #7fcf9e; --ok-bg: #16301f; --ok-border: #2f5a3f; --err: #ff8f80; --err-bg: #3d1915;
    --note-bg: #22395a; --note-fg: #b5d0f4; --badge-blue: #3d84ea; --gold: #e0b347; --tip-sub: #475a72;
    --map-bg: #131b25; --map-ring: #0e141c; --map-dot: #8fb9ef; --map-line: #8fb9ef; --net-node: #4a6585;
    --ramp-lo: #1f3049; --ramp-hi: #a9cdf7; --map-empty: #1a2330; --map-sphere: #111923; --map-border: #0e141c;
    color-scheme: dark;
  }
  html[data-theme="dark"] img.logo-on-dark, html[data-theme="dark"] .school-logo { background: #f5f7fa; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: var(--sans); background: var(--paper); color: var(--ink); font-size: 17.5px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); }
  button, input, select, textarea { font: inherit; color: inherit; }
  input[type=text], input[type=url], input[type=password], input[type=number], input[type=date], select, textarea {
    width: 100%; padding: 0.5rem 0.65rem; border: 1px solid var(--subtle); border-radius: 6px; background: var(--card);
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-light); outline-offset: 1px; border-color: var(--accent-light); }
  textarea { min-height: 80px; resize: vertical; line-height: 1.5; }
  textarea.mono, input.mono { font-family: var(--mono); font-size: 15.625px; }
  label { display: block; font-size: 15px; font-weight: 600; color: var(--muted); letter-spacing: 0.03em; text-transform: uppercase; margin-bottom: 0.3rem; }
  .field { margin-bottom: 0.9rem; min-width: 0; }
  .row { display: grid; gap: 0.9rem; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .row.two { grid-template-columns: 1fr 1fr; }
  .hint { font-size: 15px; color: var(--muted); margin-top: 0.3rem; }
  .btn { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.5rem 1rem; border: 1px solid var(--subtle); border-radius: 6px; background: var(--card); cursor: pointer; font-weight: 500; transition: all .2s; white-space: nowrap; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .btn.primary:hover { background: var(--accent-light); border-color: var(--accent-light); color: var(--on-accent); }
  .btn.danger:hover { border-color: var(--err); color: var(--err); }
  .btn.sm { padding: 0.25rem 0.6rem; font-size: 15px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .pill { display: inline-block; font-size: 13.75px; font-weight: 600; padding: 0.1rem 0.5rem; border-radius: 100px; letter-spacing: 0.03em; }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.err { background: var(--err-bg); color: var(--err); }
  .pill.muted { background: var(--highlight); color: var(--muted); }
  .pill.first { background: var(--badge-blue); color: var(--on-accent); }
  .pill.corr { background: var(--card); color: var(--badge-blue); box-shadow: inset 0 0 0 1.5px var(--badge-blue); }
  .pill.status { background: var(--warn-bg); color: var(--warn); }

  .app { display: grid; grid-template-columns: 230px 1fr; height: 100%; }
  aside { border-right: 1px solid var(--subtle); background: var(--card); padding: 1.2rem 0; display: flex; flex-direction: column; }
  .brand { padding: 0 1.2rem 1rem; border-bottom: 1px solid var(--subtle); }
  .brand h1 { font-family: var(--serif); font-weight: 600; font-size: 1.562rem; color: var(--accent); }
  .brand p { font-size: 15px; color: var(--muted); }
  nav { padding: 0.8rem 0.6rem; display: flex; flex-direction: column; gap: 2px; flex: 1; }
  nav button { text-align: left; padding: 0.5rem 0.7rem; border: none; background: none; border-radius: 6px; cursor: pointer; color: var(--muted); font-weight: 500; display: flex; justify-content: space-between; align-items: center; }
  nav button:hover { background: var(--highlight); color: var(--ink); }
  nav button.active { background: var(--highlight); color: var(--accent); font-weight: 600; }
  nav .count { font-size: 13.75px; color: var(--muted); font-weight: 500; }
  .aside-foot { padding: 0.8rem 1.2rem 0; border-top: 1px solid var(--subtle); font-size: 15px; color: var(--muted); }
  .aside-foot a { display: block; margin-top: 0.3rem; text-decoration: none; }

  main { overflow-y: auto; min-width: 0; }
  .topbar { position: sticky; top: 0; z-index: 5; background: rgba(var(--paper-rgb), 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--subtle); padding: 0.7rem 1.6rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .topbar .status { font-size: 15.625px; color: var(--muted); display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
  .topbar .actions { display: flex; gap: 0.5rem; }
  .content { padding: 1.6rem 2rem; max-width: none; }
  @media (min-width: 1500px) {
    .tv-country-body, .tv-prov-body { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 0.8rem; align-items: start; }
    .tv-country-body > .tv-prov, .tv-country-body > .hint, .tv-prov-body > .hint { grid-column: 1 / -1; }
    .tv-country-body > .item.place.open, .tv-prov-body > .item.place.open { grid-column: 1 / -1; }
    .tv-country-body > .item, .tv-prov-body > .item { margin-bottom: 0.6rem; }
  }
  @media (min-width: 2100px) { .tv-country-body, .tv-prov-body { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  /* Place editor: pairs side by side on wide screens (city | country, public | private note, sights | photos) */
  @media (min-width: 1100px) {
    .item.place .pbody:not([hidden]) { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 1.4rem; align-items: start; }
    .item.place .pbody > * { grid-column: 1 / -1; min-width: 0; }
    .item.place .pbody > .w-half { grid-column: auto; }
  }
  @media (min-width: 1100px) and (max-width: 1599px) { .item.place .pbody > .w-half-xl { grid-column: 1 / -1; } }
  h2 { font-family: var(--serif); font-weight: 400; font-size: 1.68rem; margin-bottom: 0.3rem; }
  .lead { color: var(--muted); margin-bottom: 1.4rem; font-size: 16.875px; }
  .card { background: var(--card); border: 1px solid var(--subtle); border-radius: 10px; padding: 1.2rem 1.4rem; margin-bottom: 1rem; }
  .card h3 { font-family: var(--serif); font-weight: 600; font-size: 1.312rem; margin-bottom: 0.8rem; color: var(--accent); }
  .item { background: var(--card); border: 1px solid var(--subtle); border-radius: 8px; padding: 1rem 1.2rem; margin-bottom: 0.7rem; }
  .item-head { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; margin-bottom: 0.7rem; flex-wrap: wrap; }
  .item-head .title { font-weight: 600; flex: 1; min-width: 160px; }
  .item-head .tools { display: flex; gap: 0.3rem; }
  .item-head .tools .btn { padding: 0.2rem 0.5rem; font-size: 15px; }
  .toolbar { display: flex; gap: 0.6rem; margin: 0.5rem 0 1rem; flex-wrap: wrap; align-items: center; }
  .check { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 16.25px; cursor: pointer; }
  .check input { width: auto; }
  .list-compact .item { padding: 0.7rem 1rem; }
  .pub-row { display: grid; grid-template-columns: 56px 1fr auto; gap: 0.9rem; align-items: center; cursor: pointer; }
  .pub-row img, .pub-row .nocover { width: 48px; height: 64px; object-fit: cover; border-radius: 4px; border: 1px solid var(--subtle); background: var(--highlight); display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .pub-row .t { font-weight: 600; line-height: 1.35; }
  .pub-row .m { font-size: 15.625px; color: var(--muted); margin-top: 2px; }
  .pub-row .m span { margin-right: 0.5rem; }
  .pub-edit { border-top: 1px dashed var(--subtle); margin-top: 0.9rem; padding-top: 0.9rem; }
  .cover-pick { display: flex; gap: 0.8rem; align-items: flex-start; }
  .cover-prev { width: 72px; height: 96px; flex-shrink: 0; border: 1px dashed var(--accent-light); border-radius: 6px; background: var(--highlight); display: flex; align-items: center; justify-content: center; text-align: center; font-size: 11px; line-height: 1.3; color: var(--muted); cursor: pointer; overflow: hidden; }
  .cover-prev:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
  .cover-prev img { width: 100%; height: 100%; object-fit: cover; }
  .cover-status { background: var(--highlight); border-radius: 6px; padding: 0.5rem 0.8rem; margin-bottom: 0.8rem; color: var(--accent); }

  .map-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 0.4rem; }
  .map-head h3 { margin: 0; }
  .map-legend { display: flex; align-items: center; gap: 0.4rem; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .lg-swatch { width: 14px; height: 10px; border-radius: 2px; border: 1px solid var(--subtle); }
  .lg-ramp { width: 120px; height: 10px; border-radius: 2px; margin-left: 0.8rem; }
  .map-box { width: 100%; min-height: 120px; }
  .map-box svg { display: block; }
  .card { position: relative; }
  .map-tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--paper); padding: 0.4rem 0.65rem; border-radius: 6px; font-size: 13px; line-height: 1.35; display: flex; flex-direction: column; z-index: 10; white-space: nowrap; box-shadow: 0 6px 18px rgba(13,27,42,0.25); }
  .map-tip[hidden] { display: none; }
  .map-tip span { color: var(--tip-sub); font-variant-numeric: tabular-nums; }
  /* Font picker */
  .font-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 0.6rem; margin: 0.3rem 0 1.1rem; }
  .font-opt { text-align: left; display: flex; flex-direction: column; gap: 0.3rem; padding: 0.75rem 0.9rem; border: 1px solid var(--subtle); border-radius: 8px; background: var(--card); color: var(--ink); cursor: pointer; transition: border-color .2s, background .2s; }
  .font-opt:hover { border-color: var(--accent); }
  .font-opt.on { border-color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); background: var(--highlight); }
  .font-opt .fo-k { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .font-opt .fo-h { font-size: 1.3rem; font-weight: 600; line-height: 1.25; }
  .font-opt .fo-b { font-size: 14.5px; line-height: 1.5; }
  .font-opt .fo-n { font-size: 13px; color: var(--muted); }
  .pal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 0.6rem; margin: 0.3rem 0 0.4rem; }
  .pal-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem; }
  .pal-mini { border: 1px solid; border-radius: 6px; padding: 0.55rem 0.6rem; display: grid; gap: 0.3rem; font-size: 12px; line-height: 1.3; text-align: left; }
  .pal-mini .pm-h { font-family: var(--serif); font-size: 15px; font-weight: 600; }
  .pal-mini .pm-a { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  .pal-mini .pm-row { display: flex; gap: 0.25rem; flex-wrap: wrap; }
  .pal-mini .pm-tag { font-size: 10.5px; padding: 0.1rem 0.45rem; border-radius: 100px; font-weight: 600; }
  .pal-mini .pm-badge { font-size: 10.5px; padding: 0.1rem 0.4rem; border-radius: 4px; font-weight: 600; color: #fff; }
  .pal-mini .pm-card { border: 1px solid; border-radius: 5px; padding: 0.3rem 0.4rem; font-size: 11px; }
  .pal-mini .pm-btn { text-align: center; border-radius: 5px; padding: 0.25rem; font-weight: 600; font-size: 11.5px; }
  .font-preview { border: 1px solid var(--subtle); border-radius: 10px; padding: 1.1rem 1.3rem; background: var(--paper); display: grid; gap: 0.5rem; }
  .font-preview .pv-h { font-family: var(--pv-head); font-size: 2.1rem; font-weight: 600; line-height: 1.15; }
  .font-preview .pv-h span { font-family: 'Ma Shan Zheng', var(--pv-head); font-weight: 400; color: var(--accent); margin-left: 0.4rem; }
  .font-preview .pv-a { font-family: var(--pv-body); color: var(--accent); font-weight: 500; }
  .font-preview .pv-t { font-family: var(--pv-head); font-size: 1.45rem; font-weight: 600; margin-top: 0.4rem; }
  .font-preview .pv-b { font-family: var(--pv-body); max-width: 70ch; line-height: 1.7; }

  /* Footprints editor */
  .tv-results { display: grid; gap: 0.3rem; margin-top: 0.6rem; }
  .tv-res { display: flex; justify-content: space-between; gap: 0.8rem; align-items: center; text-align: left; padding: 0.5rem 0.8rem; border: 1px solid var(--subtle); border-radius: 6px; background: var(--card); cursor: pointer; }
  .tv-res:hover { border-color: var(--accent); background: var(--highlight); }
  .tv-res .m { color: var(--muted); font-size: 15px; white-space: nowrap; }
  .tv-head { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 0.6rem; }
  .tv-top { margin: -0.2rem 0 0.9rem; }
  .tv-top .hint { margin: 0; }
  /* Footprints settings: folded cards, closed by default so adding and editing places comes first */
  details.fold { padding: 0.75rem 1.2rem; }
  details.fold > summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap; }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary::before { content: '▸'; color: var(--muted); width: 0.8em; flex: none; }
  details.fold[open] > summary::before { content: '▾'; }
  details.fold > summary .hint { font-weight: 400; margin: 0; }
  details.fold[open] > summary { margin-bottom: 0.8rem; }
  .tv-folds { margin-top: 1.6rem; }
  /* Flights editor */
  .fl-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .fl-row4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .fl-ac-wrap { position: relative; }
  .fl-sug { position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% - 1.4rem); display: grid; gap: 2px; background: var(--card); border-radius: 8px; box-shadow: 0 8px 24px var(--shadow); }
  .fl-sug:empty { display: none; }
  .fl-sug .tv-res { border-radius: 6px; }
  .fl-year { margin-bottom: 1rem; }
  .fl-yh { font-family: var(--serif); font-weight: 600; color: var(--accent); margin: 0.4rem 0; }
  .fl-item { display: grid; grid-template-columns: 4.2rem 5.5rem minmax(0, 1.2fr) minmax(0, 1.6fr) auto; gap: 0.3rem 0.8rem; align-items: center; padding: 0.55rem 0.8rem; background: var(--card); border: 1px solid var(--subtle); border-radius: 8px; margin-bottom: 0.35rem; }
  .fl-item.editing { border-color: var(--accent); box-shadow: 0 0 0 2px var(--highlight); }
  .fl-item .fl-d { color: var(--muted); }
  .fl-item .fl-m { color: var(--muted); font-size: 15px; min-width: 0; }
  .fl-item .fl-t { display: flex; gap: 0.3rem; }
  .fl-dups { border: 1px solid var(--warn); background: var(--warn-bg); }
  .fl-dups h3 { color: var(--warn); }
  .fl-dups ul { margin: 0.3rem 0 0.7rem 1.2rem; font-size: 15px; }
  .fl-fare { display: flex; gap: 0.4rem; }
  .fl-fare input { flex: 1; min-width: 0; }
  .fl-fare select { width: 6.2rem; flex: none; }
  .tv-flag { font-size: 1.4rem; line-height: 1; }
  .flag-img { height: 16px; width: 24px; aspect-ratio: 3 / 2; object-fit: cover; object-position: center; border-radius: 2px; box-shadow: 0 0 0 1px rgba(13, 27, 42, 0.12); vertical-align: -3px; flex: none; background: var(--subtle); }
  .tv-acad { background: var(--highlight); border-radius: 8px; padding: 0.9rem 1rem 0.1rem; margin-bottom: 0.9rem; }
  .thumb.tv .ph { aspect-ratio: 4/3; background: var(--highlight); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; }
  .thumb.tv .ph img { aspect-ratio: 4/3; }
  .btn.vis { margin-left: auto; font-size: 12px !important; padding: 0.1rem 0.45rem !important; }
  .btn.vis.pub, .tagbtn.vis.pub { color: var(--ok); border-color: var(--ok-border); background: var(--ok-bg); }
  .tagbtn.vis { margin-left: 0.4rem; }
  .ph-sg { display: flex; flex-wrap: wrap; gap: 0.25rem; padding: 0 0.6rem 0.4rem; }
  .ph-sg .tagbtn { font-size: 11.5px; padding: 0.05rem 0.4rem; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tv-prog { font-size: 15px; color: var(--accent); }
  .pill.acad { background: var(--accent); color: var(--on-accent); }
  .item.place > .item-head { cursor: pointer; margin-bottom: 0; user-select: none; }
  .item.place.open > .item-head { margin-bottom: 0.7rem; }
  .item.place > .item-head:hover .title { color: var(--accent); }
  .chev { display: inline-block; width: 1em; color: var(--muted); }
  .sg-row { display: grid; grid-template-columns: auto 1fr 1fr auto; gap: 0.5rem; align-items: center; padding: 0.4rem 0; border-top: 1px dashed var(--subtle); }
  .sg-row:first-child { border-top: none; }
  .sg-link { grid-column: 2 / -1; display: grid; grid-template-columns: auto 1fr auto; gap: 0.5rem; align-items: center; }
  .sg-open { display: flex; gap: 0.35rem; }
  .sg-wh { grid-column: 2 / -1; display: grid; grid-template-columns: auto minmax(0, 1.4fr) minmax(0, 1fr) auto; gap: 0.5rem; align-items: center; }
  .sg-wh select { padding: 0.25rem 0.4rem; font-size: 14.5px; }
  .sg-wh input[type=text] { padding: 0.3rem 0.5rem; font-size: 15px; }
  @media (max-width: 760px) { .sg-wh { grid-column: 1 / -1; grid-template-columns: 1fr; } }
  .logo-up { display: flex; gap: 0.5rem; align-items: center; }

// ─────────────────────────────────────────────────────────────────────────────
// Configuration
// ─────────────────────────────────────────────────────────────────────────────
// Repository: detected from the address (<owner>.github.io or <owner>.github.io/<repo>/),
// otherwise asked once on the sign-in screen and remembered in this browser (localStorage sm_repo)
const REPO = (() => {
  let saved = null; try { saved = JSON.parse(localStorage.getItem('sm_repo') || 'null'); } catch (e) {}
  if (saved) return { owner: saved.owner || '', name: saved.name || '', branch: 'main' };
  const h = location.hostname.toLowerCase(), m = h.match(/^([a-z0-9-]+)\.github\.io$/);
  if (!m) return { owner: '', name: '', branch: 'main' };
  const seg = location.pathname.split('/').filter(Boolean)[0];
  return { owner: m[1], name: seg && !/\.html?$/i.test(seg) ? seg : h, branch: 'main' };
})();
const CONTENT_PATH = 'content.json';
const SITE_URL = location.origin + location.pathname.replace(/[^/]*$/, '');
let SITE_NAME = '';
fetch('content.json', { cache: 'no-cache' }).then(r => r.json()).then(c => {
  SITE_NAME = c.profile?.name_en || ''; if (!SITE_NAME) return;
  document.title = 'Site Manager · ' + SITE_NAME;
  document.querySelectorAll('.login-name').forEach(el => { el.textContent = SITE_NAME; });
}).catch(() => {});

// fetch with a time limit: a stalled connection fails instead of hanging the page

async function gh(path, opts = {}) {
  const isWrite = /^(PUT|POST|PATCH|DELETE)$/i.test(opts.method || 'GET');
  for (let attempt = 0; ; attempt++) {
    const { timeout, ...fo } = opts;
    const res = await fetchT(`https://api.github.com${path}`, {
      ...fo,
      headers: { 'Accept': 'application/vnd.github+json', 'Authorization': `Bearer ${TOKEN}`, 'X-GitHub-Api-Version': '2022-11-28', ...(opts.headers || {}) }
    }, timeout || (isWrite ? 120000 : 30000));
    if (!res.ok) {
      let msg = res.statusText;
      try { msg = (await res.json()).message || msg; } catch (e) {}
      // Rate limit (secondary limits come from many writes in a row): wait as GitHub asks, then retry
      if ((res.status === 403 || res.status === 429) && /rate limit|abuse/i.test(msg)) {
        const ra = Number(res.headers.get('retry-after')), reset = Number(res.headers.get('x-ratelimit-reset'));
        const wait = ra > 0 ? ra : reset > 0 ? Math.max(5, reset - Math.floor(Date.now() / 1000)) : 60;
        if (attempt < 2 && wait <= 90) { toast(`GitHub asked to slow down: waiting ${wait} s, then continuing…`); await ghSleep(wait * 1000 + 500); continue; }
        const at = new Date(Date.now() + wait * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        throw new Error(`GitHub ${res.status}: rate limit reached. Please wait until about ${at} and try again.`);

}

async function ghGetFile(path) {

// PUT with the sha we know; on 409 ("does not match") or 422 ("sha wasn't supplied") re-read the current sha and try again
async function ghPutFile(path, base64Content, message, sha) {
  const url = `/repos/${REPO.owner}/${REPO.name}/contents/${encodeURIComponent(path).replace(/%2F/g, '/')}`;
  for (let attempt = 0; ; attempt++) {
    const body = { message, content: base64Content, branch: REPO.branch };
    if (sha) body.sha = sha;
    const gap = 1000 - (Date.now() - (ghPutFile.last || 0)); if (gap > 0) await ghSleep(gap);
    ghPutFile.last = Date.now();
    try { return await gh(url, { method: 'PUT', body: JSON.stringify(body) }); }
    catch (e) {
      // 409: our sha is stale; 422 "sha wasn't supplied": the file exists but we did not know it. Both: re-read and retry.
      const retryable = /GitHub 409/.test(e.message) || (/GitHub 422/.test(e.message) && /sha/i.test(e.message));
      if (!retryable || attempt >= 3) throw e;
      await new Promise(r => setTimeout(r, 1200 * (attempt + 1)));
      try { sha = (await ghGetFile(path)).sha; } catch (err) { sha = null; }
    }

}

async function fileToBase64(file) {

}

// Downscale an image file to at most 240px wide; returns a Blob/File with a name

    const c = document.createElement('canvas'); c.width = maxW; c.height = Math.round(bmp.height * maxW / bmp.width);

// Upload a file to the repo root (creates or replaces). Returns the final filename.

// Load / save content.json

async function loadContent() {
  setStatus('Loading content…');
  try {
    if (TOKEN) {
      const f = await ghGetFile(CONTENT_PATH);
      SHA = f.sha;
      C = JSON.parse(b64dec(f.content));
    } else {
      // Read-only fallback: the published copy next to this page
      const res = await fetch(CONTENT_PATH, { cache: 'no-cache' });
      if (!res.ok) throw new Error('content.json not found');
      C = await res.json(); SHA = null;
    }
    normalize();
    C_ORIG = JSON.stringify(C);
    setStatus();
    render();
  } catch (e) {
    setStatus(`Could not load content: ${e.message}`, 'err');
    $('#view').innerHTML = `<div class="card"><h3>Could not load content.json</h3><p>${esc(e.message)}</p><p class="hint">If you just set up the site, make sure content.json exists in the repository root, and that the token has <b>Contents: Read and write</b> permission for this repository.</p></div>`;
  }
}
function normalize() {
  C.site ||= {}; C.profile ||= {}; C.profile.links ||= [];
  C.research_interests ||= []; C.education ||= []; C.carousels ||= [[], []];
  C.publications ||= []; C.awards ||= []; C.cv ||= {};
  C.publications.forEach((p, i) => { p.id ||= 'pub' + String(i + 1).padStart(2, '0'); if (typeof p.corresponding !== 'boolean') p.corresponding = detectCorresponding(p.authors); });
}

// ── Corresponding author: the checkbox and the "*" after my name in the author list stay in sync ──
function myNameRe() {
  const me = (C.site.me_author || 'Doe J.').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return new RegExp('(<strong>\\s*' + me + '\\s*</strong>|' + me + ')(\\s*\\*)?');
}
function detectCorresponding(authors) {
  const m = String(authors || '').match(myNameRe());
  return !!(m && m[2]) || new RegExp('<strong>\\s*' + (C.site.me_author || 'Doe J.').replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*\\*\\s*</strong>').test(authors || '');
}
function setCorrespondingMark(authors, on) {
  let a = String(authors || '');
  const me = (C.site.me_author || 'Doe J.').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  a = a.replace(new RegExp('(<strong>\\s*' + me + ')\\s*\\*(\\s*</strong>)'), '$1$2'); // normalise "*" inside <strong>
  a = a.replace(myNameRe(), (_, name) => name + (on ? '*' : ''));

}
function contentDirty() { return !!C && JSON.stringify(C) !== C_ORIG; }
function fpDirty() { return !!FP.data && JSON.stringify(FP.data) !== FP.orig; }
function isDirty() { return contentDirty() || fpDirty(); }
function setStatus(msg, kind) {

  const dirty = isDirty();
  el.innerHTML = dirty
    ? `<span class="dirty-dot"></span> Unpublished changes`
    : `<span class="pill ok">Up to date</span> <span>${TOKEN ? 'Connected to GitHub' : 'Read-only preview (no token)'}</span>`;

}
function markDirty() { setStatus(); renderNavCounts(); }

async function saveContent() {
  if (!TOKEN) return toast('Sign in with a GitHub token to publish.', true);
  const btn = $('#btn-save'); btn.disabled = true; btn.textContent = 'Publishing…';
  try {
    if (fpDirty()) await saveFootprints();
    if (contentDirty()) {
      // Re-read the file: if the cover workflow (or another device) changed it, keep the covers it added
      try {
        const remote = await ghGetFile(CONTENT_PATH);
        if (remote.sha !== SHA) mergeRemoteCovers(JSON.parse(b64dec(remote.content)));
        SHA = remote.sha;
      } catch (e) { SHA = null; }
      await publishFontsIfChanged();
      const json = JSON.stringify(C, null, 2) + '\n';
      const r = await ghPutFile(CONTENT_PATH, b64enc(json), `Update site content via Site Manager (${new Date().toISOString().slice(0, 16).replace('T', ' ')})`, SHA);
      SHA = r.content.sha; C_ORIG = JSON.stringify(C);
      setStatus();
      const missing = coverlessWithDoi();
      toast(missing.length ? `Published. Looking for ${missing.length} journal cover${missing.length > 1 ? 's' : ''} on GitHub…` : 'Published. GitHub Pages usually updates within a minute.');
      if (missing.length) watchForCovers(SHA);
    } else { setStatus(); toast('Published. GitHub Pages usually updates within a minute.'); }
  } catch (e) { toast(e.message, true); setStatus(); }
  btn.textContent = 'Publish changes';
}

// ── Journal covers fetched by the GitHub Actions workflow (.github/workflows/fetch-covers.yml) ──
function coverlessWithDoi(pubs = C?.publications || []) {
  return pubs.filter(p => !p.cover && p.year !== 'book' && (p.doi || parseDoi(p.url)));
}
// Copy cover values from a remote content.json into the working copy (and the saved baseline)
function mergeRemoteCovers(remote) {
  const rmap = new Map((remote.publications || []).map(p => [p.id, p]));
  const apply = obj => { let n = 0; (obj.publications || []).forEach(p => { const r = rmap.get(p.id); if (!r) return;
    if (!p.cover && r.cover) { p.cover = r.cover; n++; }
    if (!p.abstract && r.abstract) p.abstract = r.abstract;
    if (!p.doi && r.doi) p.doi = r.doi; }); return n; };
  const added = apply(C);
  try { const base = JSON.parse(C_ORIG); apply(base); C_ORIG = JSON.stringify(base); } catch (e) {}
  return added;
}
let COVER_WATCH = 0;
async function watchForCovers(fromSha) {
  const run = ++COVER_WATCH;
  const deadline = Date.now() + 4 * 60 * 1000;
  setCoverStatus('Looking for journal covers on GitHub… (about 1 minute)');
  await sleep(25000);
  while (run === COVER_WATCH && Date.now() < deadline) {
    try {
      const f = await ghGetFile(CONTENT_PATH);
      if (f.sha !== fromSha) {
        const remote = JSON.parse(b64dec(f.content));
        const wasDirty = isDirty();
        const added = mergeRemoteCovers(remote);
        if (!wasDirty) { SHA = f.sha; C_ORIG = JSON.stringify(C); }
        else SHA = f.sha; // working copy already contains everything else we will publish
        REPO_FILES = null; setStatus();
        if (TAB === 'publications') render();
        const still = coverlessWithDoi().length;
        setCoverStatus(added ? `Added ${added} journal cover${added > 1 ? 's' : ''}.` + (still ? ` ${still} could not be found automatically: open the paper and paste or upload a cover.` : '') : 'No new covers were found. Open the paper and paste or upload a cover.');
        toast(added ? `Added ${added} journal cover${added > 1 ? 's' : ''}.` : 'No journal cover found automatically.');
        return;
      }
    } catch (e) {}
    await sleep(15000);
  }
  if (run === COVER_WATCH) setCoverStatus('The cover search has not finished. Check the Actions tab on GitHub, or click “Reload from GitHub” in a minute.');
}
let COVER_STATUS = '', CITE_SUMMARY = '';
// Cover results are shown after the citation summary of the same refresh, if any
function setCoverStatus(msg, keepSummary = true) { msg = keepSummary && CITE_SUMMARY && !msg.startsWith(CITE_SUMMARY) ? CITE_SUMMARY + ' ' + msg : msg; COVER_STATUS = msg; const el = $('#cover-status'); if (el) { el.textContent = msg; el.hidden = !msg; } }

// ─────────────────────────────────────────────────────────────────────────────
// Login: the GitHub token (and GoatCounter token) are encrypted with the admin
// password and stored in the repo as admin-auth.json, so any device can sign in
// with the password alone. Crypto: PBKDF2-SHA256 (600k) -> AES-256-GCM.
// ─────────────────────────────────────────────────────────────────────────────
const AUTH_PATH = 'admin-auth.json';
const AUTH_ITER = 600000;
const MIN_PW = 10;
const SS_SESSION = 'sm_session', LS_SESSION = 'sm_session_persist';
let SESSION = null;      // { gh, gc } tokens in use
let SESSION_KEY = null;  // { key, salt, iter } when unlocked with the password in this tab
let AUTH_INFO = null;    // { exists, updated } of admin-auth.json

const u8 = b => Uint8Array.from(atob(b), c => c.charCodeAt(0));
const b64u8 = a => { let s = ''; a.forEach(x => { s += String.fromCharCode(x); }); return btoa(s); };
async function deriveKey(password, salt, iter) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: iter }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);

  return { v: 1, kdf: 'PBKDF2-SHA256', iter, salt: b64u8(salt), iv: b64u8(iv), ct: b64u8(ct), updated: new Date().toISOString(),
    note: 'Encrypted sign-in for admin.html (AES-256-GCM, key derived from the admin password). Delete this file to disable password sign-in.' };
}
async function decryptBundle(file, password) {
  const salt = u8(file.salt);
  const key = await deriveKey(password, salt, file.iter || AUTH_ITER);
  let pt;
  try { pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(file.iv) }, key, u8(file.ct)); }
  catch (e) { throw new Error('Wrong password.'); }
  return { bundle: JSON.parse(new TextDecoder().decode(pt)), key, salt, iter: file.iter || AUTH_ITER };

// Read admin-auth.json fresh from the public GitHub API; fall back to the Pages copy
let AUTH_FETCH_FAILED = false;
async function fetchAuthFile() {
  AUTH_FETCH_FAILED = false; let sure404 = false;
  try {
    const r = await fetchT(`https://api.github.com/repos/${REPO.owner}/${REPO.name}/contents/${AUTH_PATH}?ref=${REPO.branch}`, { headers: { Accept: 'application/vnd.github+json' }, cache: 'no-store' }, 12000);
    if (r.status === 404) return null;
    if (r.ok) { const j = await r.json(); return JSON.parse(b64dec(j.content)); }
  } catch (e) {}
  try { const r = await fetchT(AUTH_PATH + '?t=' + Date.now(), { cache: 'no-store' }, 12000); if (r.ok) return await r.json(); if (r.status === 404) sure404 = true; } catch (e) {}

}
async function writeAuthFile(file, message) {

  await ghPutFile(AUTH_PATH, b64enc(JSON.stringify(file, null, 2) + '\n'), message, sha);
  AUTH_INFO = { exists: true, updated: file.updated };
}
async function deleteAuthFile() {

  await gh(`/repos/${REPO.owner}/${REPO.name}/contents/${AUTH_PATH}`, { method: 'DELETE', body: JSON.stringify({ message: 'Disable password sign-in for Site Manager', sha: f.sha, branch: REPO.branch }) });

// Re-encrypt the current tokens with the unlocked key (used when the GoatCounter token changes)

  const file = await encryptBundle({ gh: TOKEN, gc: SESSION?.gc || '', tp: SESSION?.tp || '', amap: SESSION?.amap || '', els: SESSION?.els || '' }, SESSION_KEY.key, SESSION_KEY.salt, SESSION_KEY.iter);
  await writeAuthFile(file, 'Update encrypted sign-in via Site Manager');
  return true;

// Session persistence: sessionStorage for this tab, localStorage only with "Keep me signed in"
function saveSession(persist) {
  const v = JSON.stringify(SESSION);
  try { sessionStorage.setItem(SS_SESSION, v); } catch (e) {}
  if (persist === true) lsSet(LS_SESSION, v);
  else if (persist === false) lsSet(LS_SESSION, null);
  else if (lsGet(LS_SESSION)) lsSet(LS_SESSION, v); // keep existing choice
}
function loadSession() {
  let raw = null;
  try { raw = sessionStorage.getItem(SS_SESSION); } catch (e) {}
  raw = raw || lsGet(LS_SESSION);
  if (!raw && lsGet(LS.token)) raw = JSON.stringify({ gh: lsGet(LS.token), gc: lsGet(LS.gcToken) || '' }); // migrate old token-only sign-in
  try { return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
}
function clearSession() {
  try { sessionStorage.removeItem(SS_SESSION); } catch (e) {}
  lsSet(LS_SESSION, null); lsSet(LS.token, null); lsSet(LS.gcToken, null);
  SESSION = null; SESSION_KEY = null; TOKEN = null;
}
const gcToken = () => SESSION?.gc || lsGet(LS.gcToken) || '';

// Check a GitHub token: returns repo info, throws a readable error
async function verifyGitHubToken(t) {
  const prev = TOKEN; TOKEN = t;
  try {
    const repo = await gh(`/repos/${REPO.owner}/${REPO.name}`);
    REPO.branch = repo.default_branch || REPO.branch;
    if (!repo.permissions || !repo.permissions.push) throw new Error('This token can read the repository but cannot write to it. In the token settings, add the permission “Contents: Read and write”.');
    return repo;
  } catch (e) {
    TOKEN = prev;
    if (/GitHub 401/.test(e.message)) throw new Error('GitHub rejected this token (expired, revoked or mistyped).');
    if (/GitHub 404/.test(e.message)) throw new Error(`This token has no access to ${REPO.owner}/${REPO.name}. Select that repository under “Repository access”.`);
    throw e;
  }

function setAuthState() {
  const el = $('#auth-state'); if (!el) return;
  el.textContent = TOKEN ? (SESSION_KEY ? 'Signed in with password' : 'Signed in') + (lsGet(LS_SESSION) ? ' · kept on this device' : '') : 'Read-only (not signed in)';
  $('#link-signout').textContent = TOKEN ? 'Sign out' : 'Sign in';
}

// Full-screen sign-in. Resolves once signed in or the viewer chooses read-only.
function showLogin(opts = {}) {
  return new Promise(async resolve => {
    const root = $('#modal-root');
    const done = () => { root.innerHTML = ''; setAuthState(); resolve(); };
    const frame = inner => `<div class="login"><div class="login-card">
      <div class="login-brand"><span class="login-name">${esc(SITE_NAME || 'Site Manager')}</span><span class="login-sub">Site Manager · ${esc(REPO.owner ? REPO.owner + '/' + REPO.name : location.host)}</span></div>
      ${inner}</div>
      <p class="login-foot"><a href="index.html">← Back to website</a>${REPO.owner ? ` · <a href="#" onclick="try{localStorage.setItem('sm_repo','{}')}catch(e){};location.reload();return false;" title="Use a different GitHub repository">Change repository</a>` : ''}</p></div>`;
    root.innerHTML = frame('<p class="hint" style="text-align:center;padding:1.5rem 0">Checking sign-in…</p>');
    if (!REPO.owner || !REPO.name) await new Promise(ok => {
      root.innerHTML = frame(`<h2>Which repository?</h2>
        <p class="lead">This page is not on a <code>&lt;username&gt;.github.io</code> address, so the Site Manager cannot tell which GitHub repository holds the website. Enter it once; it is remembered in this browser.</p>
        <form id="f-repo"><div class="field"><label for="r-name">Repository</label><input id="r-name" type="text" class="mono" placeholder="username/username.github.io" required></div>
        <button class="btn primary block" type="submit">Continue</button><p class="login-msg" id="r-msg"></p></form>`);
      $('#r-name').focus();
      $('#f-repo').onsubmit = e => { e.preventDefault();
        const m = $('#r-name').value.trim().replace(/^https?:\/\/github\.com\//i, '').replace(/\.git$/i, '').replace(/\/+$/, '').match(/^([\w.-]+)\/([\w.-]+)$/);
        if (!m) { $('#r-msg').textContent = 'Write it as username/repository, e.g. jane-doe/jane-doe.github.io'; return; }
        REPO.owner = m[1]; REPO.name = m[2]; try { localStorage.setItem('sm_repo', JSON.stringify({ owner: m[1], name: m[2] })); } catch (e) {}
        const b = document.getElementById('brand-sub'); if (b) b.textContent = `${m[1]}/${m[2]}`;
        root.innerHTML = frame('<p class="hint" style="text-align:center;padding:1.5rem 0">Checking sign-in…</p>'); ok(); };
    });

    const file = await fetchAuthFile();
    AUTH_INFO = { exists: !!file, updated: file?.updated };
    if (!file && AUTH_FETCH_FAILED) {   // could not reach GitHub: do not guess, offer a retry
      root.innerHTML = frame(`<h2>Can't reach GitHub</h2><p class="hint" style="margin:0.4rem 0 1rem">The sign-in settings could not be loaded (slow network, GitHub busy, or too many requests in a short time). Wait a minute and try again.</p>

// Restore a session from this tab / device, otherwise show the sign-in screen
async function ensureSignedIn() {
  const s = loadSession();
  if (s && s.gh) {
    try {
      await verifyGitHubToken(s.gh);
      TOKEN = s.gh; SESSION = s;
      if (lsGet(LS.token)) { lsSet(LS.token, null); lsSet(LS.gcToken, null); saveSession(true); } // finish migration
      fetchAuthFile().then(f => { AUTH_INFO = { exists: !!f, updated: f?.updated }; });
      setAuthState(); return;
    } catch (e) {
      if (/rejected this token|no access to|cannot write/i.test(e.message)) { clearSession(); return showLogin({ message: 'Your session expired. Please sign in again.' }); }
      return new Promise(resolve => {   // network trouble or rate limit: keep the session, offer a retry
        const root = $('#modal-root');
        root.innerHTML = `<div class="login"><div class="login-card"><div class="login-brand"><span class="login-name">${esc(SITE_NAME || 'Site Manager')}</span><span class="login-sub">Site Manager · ${esc(REPO.owner ? REPO.owner + '/' + REPO.name : location.host)}</span></div>
          <h2>Can't reach GitHub</h2><p class="hint" style="margin:0.4rem 0 1rem">${esc(e.message)}</p>
          <button class="btn primary block" id="lg-retry" type="button">Try again</button>
          <p class="hint" style="text-align:center;margin-top:0.8rem"><a href="#" id="lg-fresh">Sign in again instead</a></p></div>
          <p class="login-foot"><a href="index.html">← Back to website</a>${REPO.owner ? ` · <a href="#" onclick="try{localStorage.setItem('sm_repo','{}')}catch(e){};location.reload();return false;" title="Use a different GitHub repository">Change repository</a>` : ''}</p></div>`;
        $('#lg-retry').onclick = () => { root.innerHTML = ''; ensureSignedIn().then(resolve); };
        $('#lg-fresh').onclick = ev => { ev.preventDefault(); root.innerHTML = ''; clearSession(); showLogin().then(resolve); };
      });
    }
  }
  return showLogin();
}

// bind(obj, key) returns attributes for an input; onInput writes back
const BIND = new Map(); let bindSeq = 0;
function bind(obj, key, type = 'text', extra = '') {
  const id = 'b' + (++bindSeq); BIND.set(id, { obj, key, type });
  const v = obj[key];

  if (type === 'textarea') return `<textarea data-bind="${id}" ${extra}>${esc(v)}</textarea>`;
  if (type === 'select') return `<select data-bind="${id}" ${extra}></select>`;
  return `<input type="${type === 'number' ? 'number' : 'text'}" data-bind="${id}" value="${esc(v ?? '')}" ${extra}>`;
}
function biField(label, obj, key, type = 'text') {
  obj[key] ||= { en: '', zh: '' };

    <div>${bind(obj[key], 'en', type, 'placeholder="English"')}</div>

}
function field(label, obj, key, type = 'text', hint = '', extra = '') {
  return `<div class="field"><label>${label}</label>${bind(obj, key, type, extra)}${hint ? `<div class="hint">${hint}</div>` : ''}</div>`;
}
function wireBindings(root = document) {
  root.querySelectorAll('[data-bind]').forEach(el => {
    const b = BIND.get(el.dataset.bind); if (!b) return;
    const handler = () => {
      let v = el.type === 'checkbox' ? el.checked : el.value;
      if (b.type === 'number') v = el.value === '' ? null : Number(el.value);
      b.obj[b.key] = v; markDirty();
      if (b.onChange) b.onChange(v);
    };
    el.addEventListener('input', handler); el.addEventListener('change', handler);
  });
}
function itemTools(arr, i, onChange) {
  return `<div class="tools">
    <button class="btn" title="Move up" data-act="up" ${i === 0 ? 'disabled' : ''}>↑</button>
    <button class="btn" title="Move down" data-act="down" ${i === arr.length - 1 ? 'disabled' : ''}>↓</button>
    <button class="btn danger" title="Remove" data-act="del">✕</button></div>`;
}
function wireItemTools(root, arr, rerender) {
  root.querySelectorAll('.item[data-i], .thumb[data-i]').forEach(item => {
    const i = Number(item.dataset.i);

      if (act === 'down' && i < arr.length - 1) [arr[i + 1], arr[i]] = [arr[i], arr[i + 1]];

// Logo images for the Education tab: SVG kept, others resized to at most 240 px (PNG keeps transparency)
const LOGO_PREVIEW = new Map();
async function shrinkLogo(file) {
  if (/svg/i.test(file.type) || /\.svg$/i.test(file.name)) { const f = new File([file], 'logo.svg', { type: 'image/svg+xml' }); f.ext = 'svg'; return f; }
  const bmp = await createImageBitmap(file), k = Math.min(1, 240 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(bmp.width * k)); c.height = Math.max(1, Math.round(bmp.height * k));
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  const blob = await new Promise((ok, no) => c.toBlob(b => b ? ok(b) : no(new Error('Could not read this image.')), 'image/png'));
  const f = new File([blob], 'logo.png', { type: 'image/png' }); f.ext = 'png'; return f;
}

function parseDoi(s) { const m = String(s || '').match(/10\.\d{4,9}\/[^\s"<>]+/i); return m ? m[0].replace(/[.,;)]+$/, '') : null; }

function fmtAuthor(a) { return a.family ? `${a.family} ${initials(a.given)}`.trim() : (a.name || ''); }
function normName(s) { return String(s || '').toLowerCase().replace(/[^a-z]/g, ''); }
// Convert JATS/HTML fragments to plain text; drops a leading <jats:title>Abstract</jats:title> heading
function stripTags(s) {
  const d = document.createElement('div');
  d.innerHTML = String(s || '').replace(/<jats:title>[^<]*<\/jats:title>/gi, '').replace(/<\/?jats:[^>]*>/gi, ' ');
  return d.textContent.replace(/\s+/g, ' ').trim();
}
function invertedToText(idx) {
  if (!idx) return ''; const words = [];
  Object.entries(idx).forEach(([w, pos]) => pos.forEach(p => { words[p] = w; }));
  return words.join(' ').trim();
}
async function fetchJson(url, headers = {}) { const r = await fetch(url, { headers }); if (!r.ok) throw new Error(`${new URL(url).host} ${r.status}`); return r.json(); }
// ── Abstracts: Crossref → OpenAlex → Semantic Scholar → Europe PMC (all open, no key) ──
function cleanAbstract(s) { return String(s || '').replace(/\s+/g, ' ').replace(/^\s*(abstract|summary)\s*[:.\-–]?\s*/i, '').trim(); }
const goodAbstract = a => a.length >= 80 && !/^(no abstract|abstract not available)/i.test(a);
const elsKey = () => SESSION?.els || '';
// Elsevier Article Retrieval API (needs a free key; works from the browser, the API sends CORS headers)
async function elsevierAbstract(doi) {
  if (!elsKey() || !/^10\.1016\//i.test(doi)) return '';
  try {
    const j = await fetchJson(`https://api.elsevier.com/content/article/doi/${encodeURIComponent(doi)}?view=META_ABS&httpAccept=application/json&apiKey=${encodeURIComponent(elsKey())}`);
    return cleanAbstract(stripTags(j?.['full-text-retrieval-response']?.coredata?.['dc:description']));
  } catch (e) { return ''; }
}
async function europePmcAbstract(doi) {
  try {
    const j = await fetchJson(`https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=${encodeURIComponent(`DOI:"${doi}"`)}&resultType=core&format=json&pageSize=1`);
    return cleanAbstract(stripTags(j?.resultList?.result?.[0]?.abstractText));
  } catch (e) { return ''; }
}
async function findAbstract(doi) {
  const tries = [
    async () => stripTags((await fetchJson(`https://api.crossref.org/works/${encodeURIComponent(doi)}`)).message?.abstract),
    async () => invertedToText((await fetchJson(`https://api.openalex.org/works/doi:${encodeURIComponent(doi)}?select=abstract_inverted_index`)).abstract_inverted_index),
    async () => (await fetchJson(`https://api.semanticscholar.org/graph/v1/paper/DOI:${encodeURIComponent(doi)}?fields=abstract`)).abstract,
    () => europePmcAbstract(doi), () => elsevierAbstract(doi)];
  for (const t of tries) { try { const a = cleanAbstract(await t()); if (goodAbstract(a)) return a; } catch (e) {} }
  return '';
}
// Returns a partial publication record built from public metadata APIs
async function lookupDoi(doiInput, status = () => {}) {
  const doi = parseDoi(doiInput); if (!doi) throw new Error('That does not look like a DOI (expected 10.xxxx/…).');
  const out = { doi, url: `https://doi.org/${doi}` };
  const me = normName(C.site.me_author || 'Doe J.');
  status('Crossref…');
  let cr = null;
  try { cr = (await fetchJson(`https://api.crossref.org/works/${encodeURIComponent(doi)}`)).message; } catch (e) {}
  status('OpenAlex…');
  let oa = null;
  try { oa = await fetchJson(`https://api.openalex.org/works/doi:${encodeURIComponent(doi)}`); } catch (e) {}
  if (!cr && !oa) throw new Error('DOI not found in Crossref or OpenAlex.');

  // Title
  out.title = (cr && cr.title && cr.title[0]) || (oa && (oa.display_name || oa.title)) || '';
  out.title = stripTags(out.title);
  // Authors
  let authors = [];
  if (cr && cr.author && cr.author.length) authors = cr.author.map(fmtAuthor);
  else if (oa && oa.authorships) authors = oa.authorships.map(a => { const n = (a.author?.display_name || '').trim().split(/\s+/); return n.length > 1 ? `${n[n.length - 1]} ${initials(n.slice(0, -1).join(' '))}` : n[0]; });
  authors = authors.filter(Boolean);
  out.first_author = authors.length > 0 && normName(authors[0]) === me;
  out.authors = authors.map(a => normName(a) === me ? `<strong>${esc(a)}</strong>` : esc(a)).join(', ');
  // Venue: Journal, vol(issue), pages|article-number
  const journal = stripTags((cr && cr['container-title'] && cr['container-title'][0]) || oa?.primary_location?.source?.display_name || '');
  const vol = cr?.volume || oa?.biblio?.volume || '', issue = cr?.issue || oa?.biblio?.issue || '';
  let pages = (cr?.page || '').replace(/-/g, '–');
  if (!pages && oa?.biblio?.first_page) pages = oa.biblio.first_page + (oa.biblio.last_page && oa.biblio.last_page !== oa.biblio.first_page ? '–' + oa.biblio.last_page : '');
  if (!pages && cr?.['article-number']) pages = cr['article-number'];
  out.venue = journal + (vol ? `, ${vol}` : '') + (issue ? `(${issue})` : '') + (pages ? `, ${pages}` : '');
  out.journal = journal;
  // Year
  const dp = cr?.issued?.['date-parts']?.[0]?.[0] || cr?.['published-online']?.['date-parts']?.[0]?.[0] || oa?.publication_year;
  if (dp) out.year = String(dp);
  // Citations (OpenAlex; differs from Google Scholar)
  if (oa && typeof oa.cited_by_count === 'number') out.cited = oa.cited_by_count;
  // Abstract
  out.abstract = cleanAbstract(stripTags(cr?.abstract) || invertedToText(oa?.abstract_inverted_index));
  if (!out.abstract) {
    status('Semantic Scholar…');
    try { const ss = await fetchJson(`https://api.semanticscholar.org/graph/v1/paper/DOI:${encodeURIComponent(doi)}?fields=abstract,citationCount`); out.abstract = ss.abstract || ''; if (out.cited == null && typeof ss.citationCount === 'number') out.cited = ss.citationCount; } catch (e) {}
  }
  out.abstract = cleanAbstract(out.abstract);
  if (!goodAbstract(out.abstract)) { status('Europe PMC…'); out.abstract = (await europePmcAbstract(doi)) || out.abstract; }
  if (!goodAbstract(out.abstract) && elsKey()) { status('Elsevier…'); out.abstract = (await elsevierAbstract(doi)) || out.abstract; }
  // Reuse an existing journal cover for the same journal
  if (journal) { const same = C.publications.find(p => p.cover && normName(p.venue).startsWith(normName(journal).slice(0, 12))); if (same) out.cover = same.cover; }
  return out;
}
// Find a DOI for a paper that has none, by exact title match on OpenAlex
async function findDoiByTitle(p) {
  const title = stripTags(p.title || ''); if (title.length < 15) return null;
  try {
    const r = await fetchJson(`https://api.openalex.org/works?search=${encodeURIComponent(title)}&per-page=5&select=doi,display_name,cited_by_count,publication_year`);
    const want = normName(title);
    const hit = (r.results || []).find(w => {
      const got = normName(w.display_name);
      if (!got || !w.doi) return false;
      if (got === want) return true;
      const [short, long] = got.length < want.length ? [got, want] : [want, got];
      return long.startsWith(short) && short.length / long.length > 0.6; // title vs title+subtitle
    });
    return hit ? { doi: hit.doi.replace(/^https?:\/\/doi\.org\//i, ''), cited: hit.cited_by_count } : null;
  } catch (e) { return null; }
}

// One click: refresh citation counts, fill missing DOIs, publish, then let GitHub fetch missing covers
async function refreshAll(btn) {
  const label = btn.textContent;
  const pubs = C.publications.filter(p => p.year !== 'book');
  btn.disabled = true;
  let n = 0, changed = 0, doisAdded = 0, notFound = [], absAdded = 0, absMissing = 0, absMissingNames = [];
  for (const p of pubs) {
    btn.textContent = `Updating citations… ${++n}/${pubs.length}`;
    let doi = p.doi || parseDoi(p.url) || parseDoi(p.venue);
    let cited = null;
    try {
      if (!doi) {
        if (p.status) continue; // unpublished manuscripts have no DOI yet
        const f = await findDoiByTitle(p);
        if (f) { doi = f.doi; cited = f.cited; p.doi = doi; doisAdded++; }
      }
      if (doi && cited == null) {
        const oa = await fetchJson(`https://api.openalex.org/works/doi:${encodeURIComponent(doi)}?select=cited_by_count`);
        cited = oa.cited_by_count;
        if (!p.doi) { p.doi = doi; doisAdded++; }
      }
    } catch (e) {}
    if (doi && !p.status && !goodAbstract(cleanAbstract(p.abstract))) {
      btn.textContent = `Looking for abstracts… ${n}/${pubs.length}`;
      const a = await findAbstract(doi);
      if (a) { p.abstract = a; absAdded++; } else { absMissing++; absMissingNames.push(p.title_short || p.title); }
    }
    if (typeof cited === 'number') { if (cited !== p.cited) { p.cited = cited; changed++; } }
    else if (!p.status) notFound.push(p.title_short || p.title);
    await sleep(120);
  }
  C.site.last_refresh = new Date().toISOString(); // always changes, so publishing always triggers the cover search
  markDirty(); render();
  CITE_SUMMARY = '';
  const summary = `Citations: ${changed} updated` + (doisAdded ? `, ${doisAdded} DOI${doisAdded > 1 ? 's' : ''} filled in` : '') + (notFound.length ? `, ${notFound.length} not found on OpenAlex` : '') + '.' + (absAdded ? ` Abstracts: ${absAdded} added.` : '') + (absMissing ? ` ${absMissing} abstract${absMissing > 1 ? 's' : ''} not in the open databases${elsKey() ? '' : ' (an Elsevier API key often helps, see the card below)'}: GitHub will try the publisher pages next.` : '');
  if (absMissingNames.length) console.info('No abstract found for:', absMissingNames);
  if (!TOKEN) { toast(summary + ' Sign in to publish.'); btn.disabled = false; btn.textContent = label; return; }
  btn.textContent = 'Publishing…';
  CITE_SUMMARY = summary;
  await saveContent();
  const missing = coverlessWithDoi().length;
  setCoverStatus((missing ? ` Looking for ${missing} missing cover${missing > 1 ? 's' : ''} on GitHub… (about 1 minute)` : ' All published papers already have a cover.'));
  if (notFound.length) console.info('No OpenAlex record for:', notFound);
  btn.disabled = false; btn.textContent = label;
}

        if (!p1) password = cur;
      }
      if (newTok) { msg.textContent = 'Checking new token…'; await verifyGitHubToken(newTok); bundle.gh = newTok; }
      msg.textContent = 'Encrypting and saving…';
      TOKEN = bundle.gh;
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const key = await deriveKey(password, salt, AUTH_ITER);
      await writeAuthFile(await encryptBundle(bundle, key, salt, AUTH_ITER), exists ? 'Update encrypted sign-in via Site Manager' : 'Set up encrypted sign-in for Site Manager');
      SESSION = bundle; SESSION_KEY = { key, salt, iter: AUTH_ITER }; saveSession();
      setAuthState(); toast(exists ? 'Sign-in updated.' : 'Password sign-in is on. Use it on any device.');

    try { await deleteAuthFile(); SESSION_KEY = null; setAuthState(); toast('Password sign-in turned off. Sign in with a token from now on.'); renderAccount(); }
    catch (err) { msg.textContent = err.message; }
  };
}

async function encryptBytes(key, bytes) {

async function resizeJpeg(file, maxW, q = 0.85) {
  const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
  const scale = Math.min(1, maxW / bmp.width);
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', q));
  return { bytes: new Uint8Array(await blob.arrayBuffer()), w: c.width, h: c.height, blob };
}

// CSV → flights. Returns { added, msg }.
function parseCsv(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; continue; }
    if (c === '"') q = true; else if (c === ',' || c === ';' || c === '\t') { row.push(cell); cell = ''; } else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; } else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
function importFlightsCsv(text, flights) {
  const rows = parseCsv(String(text || '').trim());
  if (rows.length < 2) return { added: 0, msg: 'Paste a CSV with a header row and at least one flight.' };
  const head = rows[0].map(h => fold(h).replace(/[^a-z]/g, ''));
  const col = (...names) => head.findIndex(h => names.includes(h));
  const C = { date: col('date'), no: col('flightnumber', 'flight', 'flightno', 'flightnr'), from: col('from', 'origin', 'departure', 'dep'), to: col('to', 'destination', 'arrival', 'arr'),
    al: col('airline', 'carrier'), ac: col('aircraft', 'aircrafttype', 'type', 'equipment'), reg: col('registration', 'reg', 'tail'), seat: col('seat', 'seatnumber'),
    cls: col('class', 'flightclass', 'cabin'), pur: col('reason', 'flightreason', 'purpose'), dur: col('duration', 'flighttime', 'time'), note: col('note', 'notes', 'comment'),
    dep: col('deptime', 'departuretime', 'actualdeparture', 'actualdeparturetime', 'atd', 'takeoff', 'takeofftime', 'offblock'), arr: col('arrtime', 'arrivaltime', 'actualarrival', 'actualarrivaltime', 'ata', 'landing', 'landingtime', 'onblock'),
    fare: col('fare', 'price', 'ticketprice', 'cost', 'farepaid'), cur: col('currency', 'cur'), age: col('aircraftage', 'age', 'planeage') };
  if (C.date < 0 || C.from < 0 || C.to < 0) return { added: 0, msg: 'The header needs at least Date, From and To columns.' };
  const ap = s => { s = String(s || '').trim(); const m = /\(([A-Z]{3})\s*[\/)]/.exec(s) || /^([A-Z]{3})$/.exec(s.toUpperCase()) || /\b([A-Z]{3})\b/.exec(s); return m ? AVDB.byIata.get(m[1].toUpperCase()) : null; };
  const byKey = new Map(flights.map(f => [flKey(f), f]));
  let added = 0, skipped = 0, updated = 0; const bad = [];
  rows.slice(1).forEach((r, n) => {
    const g = k => C[k] >= 0 ? String(r[C[k]] || '').trim() : '';
    const dm = /(\d{4})-(\d{1,2})-(\d{1,2})/.exec(g('date')) || /(\d{1,2})[./](\d{1,2})[./](\d{4})/.exec(g('date'));
    const date = dm ? (dm[1].length === 4 ? `${dm[1]}-${dm[2].padStart(2, '0')}-${dm[3].padStart(2, '0')}` : `${dm[3]}-${dm[2].padStart(2, '0')}-${dm[1].padStart(2, '0')}`) : '';
    const a = ap(g('from')), b = ap(g('to'));
    if (!date || !a || !b) { bad.push(n + 2); return; }
    const no = g('no').toUpperCase().replace(/\s+/g, '');
    const fp = parseFare(g('fare') + ' ' + g('cur')), extra = { dep: parseTime(g('dep')) || '', arr: parseTime(g('arr')) || '', fare: fp.fare, cur: fp.fare ? (fp.cur || 'CNY') : '', age: g('age') ? parseAge(g('age'), date) : null };
    const old = byKey.get([date, flNo(no), a.iata, b.iata].join('|'));
    if (old) {   // already logged: the row's filled-in cells update it
      const n0 = g('note'), note = !n0 || (old.note || '').includes(n0) ? old.note : (old.note ? old.note + ' · ' + n0 : n0);   // notes add up instead of replacing
      const upd = { ...extra, reg: g('reg').toUpperCase(), seat: g('seat').toUpperCase(), dur: parseDur(g('dur')), note };
      let ch = false; Object.entries(upd).forEach(([k, v]) => { if (!flEmpty(v) && old[k] !== v) { old[k] = v; ch = true; } });
      ch ? updated++ : skipped++; return;
    }
    const alS = g('al'), alCode = (/\(([A-Z0-9]{2})\s*[\/)]/.exec(alS) || [])[1] || (/^[A-Z0-9]{2}\d/.test(no) ? no.slice(0, 2) : '');
    const alDb = AVDB.airlines.find(x => x.iata === alCode && (!alS || fold(alS).includes(fold(x.name).split(' ')[0]))) || AVDB.airlines.find(x => alS && fold(x.name) === fold(alS.replace(/\s*\(.*$/, '')));
    const acS = g('ac'), acCode = (/\(([A-Z0-9]{3,4})\)/.exec(acS) || [])[1] || acS.toUpperCase();
    const ty = Aviation.type(acCode) || Aviation.TYPES.find(t => acS && fold(acS).startsWith(fold(t.name)));
    const clsS = fold(g('cls')), purS = fold(g('pur'));
    flights.push({ id: 'fl-' + rid(), date, no, airline: alDb ? alRecord(alDb) : (alS ? { iata: '', icao: '', name: alS.replace(/\s*\(.*$/, ''), zh: '' } : null),
      from: apRecord(a), to: apRecord(b), ac: ty ? ty.code : '', acText: ty ? '' : acS, reg: g('reg').toUpperCase(), seat: g('seat').toUpperCase(),
      cls: /first|^3$/.test(clsS) ? 'first' : /business|^2$/.test(clsS) ? 'business' : /premium|\+|^4$/.test(clsS) ? 'premium' : /econ|^1$/.test(clsS) ? 'economy' : '',
      purpose: /academ|conference|business|work|^2$/.test(purS) ? 'academic' : 'personal', dur: parseDur(g('dur')), note: g('note'), ...extra });
    byKey.set(flKey(flights[flights.length - 1]), flights[flights.length - 1]); added++;
  });
  return { added: added + updated, msg: `Imported ${added} flight${added === 1 ? '' : 's'}${updated ? `, updated ${updated} already in the list` : ''}${skipped ? `, ${skipped} already in the list unchanged` : ''}${bad.length ? `; rows ${bad.slice(0, 8).join(', ')}${bad.length > 8 ? '…' : ''} skipped (date or airport not recognised)` : ''}.` };
}

// GoatCounter rate-limits the API, so requests run one at a time, retry on 429 and are cached briefly
const GC_CACHE = new Map();
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function gcFetch(url, opts = {}, tries = 4) {
  const hit = GC_CACHE.get(url);
  if (hit && Date.now() - hit.t < 5 * 60 * 1000) return hit.v;
  for (let i = 0; i < tries; i++) {
    const res = await fetch(url, opts);
    if (res.status === 429) {
      const reset = Number(res.headers.get('X-Rate-Limit-Reset') || res.headers.get('Retry-After')) || (i + 1) * 2;
      await sleep(Math.min(reset, 15) * 1000 + 300);
      continue;
    }
    if (res.status === 404) { GC_CACHE.set(url, { t: Date.now(), v: null }); return null; }
    if (!res.ok) throw new Error(`GoatCounter ${res.status}`);
    const v = await res.json();
    GC_CACHE.set(url, { t: Date.now(), v });
    await sleep(350);
    return v;
  }
  throw new Error('GoatCounter is rate-limiting requests; try again in a minute');
}

  }

  // With an API token: four sequential API calls
  const q = `?start=${dstr(start)}T00:00:00Z&end=${dstr(end)}T23:59:59Z`;
  try {
    msg.textContent = 'Loading totals…';
    const total = await gcApi(code, token, `/stats/total${q}`); if (stale()) return;
    msg.textContent = 'Loading pages…';
    const hits = await gcApi(code, token, `/stats/hits${q}&limit=50`); if (stale()) return;
    msg.textContent = 'Loading countries…';
    const locs = await gcApi(code, token, `/stats/locations${q}&limit=200`); if (stale()) return;
    msg.textContent = 'Loading referrers…';
    const refs = await gcApi(code, token, `/stats/toprefs${q}&limit=15`); if (stale()) return;

    const pages = (hits?.hits || []).filter(h => !h.event);
    const sum = arr => arr.reduce((a, h) => a + (h.count ?? 0), 0);
    const allViews = total?.total ?? sum(pages);
    // Daily series from /stats/total; fall back to summing per-page stats
    const daily = {};
    if (total?.stats?.length) total.stats.forEach(s => { daily[s.day] = (daily[s.day] || 0) + (s.daily ?? (s.hourly || []).reduce((a, b) => a + b, 0)); });
    else pages.forEach(h => (h.stats || []).forEach(s => { daily[s.day] = (daily[s.day] || 0) + (s.daily ?? (s.hourly || []).reduce((a, b) => a + b, 0)); }));
    const days = Object.keys(daily).sort(); const vals = days.map(d => daily[d]);

    let html = tiles(fmtN(allViews), fmtN(sum(pages.filter(h => isHome(h.path)))), fmtN(sum(pages.filter(h => isPubs(h.path)))));
    if (!allViews) html += `<div class="card"><p class="hint">No visits recorded yet. GoatCounter only counts visits after the tracking script is live: check that the site code is published under <b>CV &amp; site settings</b>, then open the website once and come back in a few minutes. Your own visits from this browser may be ignored if you enabled that in GoatCounter.</p></div>`;
    else html += `<div class="card"><h3>Daily page views</h3>${sparkline(days, vals)}</div>
      <div class="card"><div class="map-head"><h3>Visitors by country</h3><div class="map-legend" id="gc-legend"></div></div>
        <div class="map-box" id="gc-map" role="img" aria-label="World map of page views by country"><p class="hint">Loading map…</p></div>
        <div class="map-tip" id="gc-map-tip" hidden></div></div>
      <div class="two-col">
        <div class="card"><h3>Countries</h3>${bars((locs?.stats || []).slice(0, 15).map(x => ({ name: x.name || x.id || 'Unknown', n: x.count })))}</div>
        <div class="card"><h3>Referrers</h3>${bars((refs?.stats || []).map(x => ({ name: x.name || x.id || '(direct)', n: x.count })))}</div>
      </div>
      <div class="card"><h3>Pages</h3>${bars(pages.map(h => ({ name: h.path, n: h.count })))}</div>`;
    body.innerHTML = html; msg.textContent = '';
    if (allViews) renderVisitorMap(locs?.stats || []);
  } catch (e) {
    if (stale()) return;
    body.innerHTML = `<div class="card"><p class="hint">Could not load statistics (${esc(e.message)}). If this says 401 or 403, the API token needs the <b>Read statistics</b> permission. You can always open the GoatCounter dashboard directly.</p></div>`;
    msg.textContent = '';
  }
}

// ── Visitor map: choropleth of page views by country (GoatCounter gives countries, never IPs) ──
const ISO_A2_TO_NUM = {"AW":"533","AF":"004","AO":"024","AI":"660","AX":"248","AL":"008","AD":"020","AE":"784","AR":"032","AM":"051","AS":"016","AQ":"010","TF":"260","AG":"028","AU":"036","AT":"040","AZ":"031","BI":"108","BE":"056","BJ":"204","BQ":"535","BF":"854","BD":"050","BG":"100","BH":"048","BS":"044","BA":"070","BL":"652","BY":"112","BZ":"084","BM":"060","BO":"068","BR":"076","BB":"052","BN":"096","BT":"064","BV":"074","BW":"072","CF":"140","CA":"124","CC":"166","CH":"756","CL":"152","CN":"156","CI":"384","CM":"120","CD":"180","CG":"178","CK":"184","CO":"170","KM":"174","CV":"132","CR":"188","CU":"192","CW":"531","CX":"162","KY":"136","CY":"196","CZ":"203","DE":"276","DJ":"262","DM":"212","DK":"208","DO":"214","DZ":"012","EC":"218","EG":"818","ER":"232","EH":"732","ES":"724","EE":"233","ET":"231","FI":"246","FJ":"242","FK":"238","FR":"250","FO":"234","FM":"583","GA":"266","GB":"826","GE":"268","GG":"831","GH":"288","GI":"292","GN":"324","GP":"312","GM":"270","GW":"624","GQ":"226","GR":"300","GD":"308","GL":"304","GT":"320","GF":"254","GU":"316","GY":"328","HK":"344","HM":"334","HN":"340","HR":"191","HT":"332","HU":"348","ID":"360","IM":"833","IN":"356","IO":"086","IE":"372","IR":"364","IQ":"368","IS":"352","IL":"376","IT":"380","JM":"388","JE":"832","JO":"400","JP":"392","KZ":"398","KE":"404","KG":"417","KH":"116","KI":"296","KN":"659","KR":"410","KW":"414","LA":"418","LB":"422","LR":"430","LY":"434","LC":"662","LI":"438","LK":"144","LS":"426","LT":"440","LU":"442","LV":"428","MO":"446","MF":"663","MA":"504","MC":"492","MD":"498","MG":"450","MV":"462","MX":"484","MH":"584","MK":"807","ML":"466","MT":"470","MM":"104","ME":"499","MN":"496","MP":"580","MZ":"508","MR":"478","MS":"500","MQ":"474","MU":"480","MW":"454","MY":"458","YT":"175","NA":"516","NC":"540","NE":"562","NF":"574","NG":"566","NI":"558","NU":"570","NL":"528","NO":"578","NP":"524","NR":"520","NZ":"554","OM":"512","PK":"586","PA":"591","PN":"612","PE":"604","PH":"608","PW":"585","PG":"598","PL":"616","PR":"630","KP":"408","PT":"620","PY":"600","PS":"275","PF":"258","QA":"634","RE":"638","RO":"642","RU":"643","RW":"646","SA":"682","SD":"729","SN":"686","SG":"702","GS":"239","SH":"654","SJ":"744","SB":"090","SL":"694","SV":"222","SM":"674","SO":"706","PM":"666","RS":"688","SS":"728","ST":"678","SR":"740","SK":"703","SI":"705","SE":"752","SZ":"748","SX":"534","SC":"690","SY":"760","TC":"796","TD":"148","TG":"768","TH":"764","TJ":"762","TK":"772","TM":"795","TL":"626","TO":"776","TT":"780","TN":"788","TR":"792","TV":"798","TW":"158","TZ":"834","UG":"800","UA":"804","UM":"581","UY":"858","US":"840","UZ":"860","VA":"336","VC":"670","VE":"862","VG":"092","VI":"850","VN":"704","VU":"548","WF":"876","WS":"882","YE":"887","ZA":"710","ZM":"894","ZW":"716","XK":"-99"};
const MAP_LIBS = { d3: 'https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js',
  topo: 'https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js',
  world: 'https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json' };
let WORLD = null;
function loadScriptOnce(src, test) {
  if (test()) return Promise.resolve();
  return new Promise((ok, fail) => { const el = document.createElement('script'); el.src = src; el.onload = ok; el.onerror = () => fail(new Error('Could not load ' + src)); document.head.appendChild(el); });
}
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
async function renderVisitorMap(stats) {
  const box = $('#gc-map'); if (!box) return;
  try {
    await loadScriptOnce(MAP_LIBS.d3, () => window.d3);
    await loadScriptOnce(MAP_LIBS.topo, () => window.topojson);
    WORLD ||= await fetchJson(MAP_LIBS.world);
  } catch (e) { box.innerHTML = `<p class="hint">The map could not be loaded (${esc(e.message)}). The country list below has the same numbers.</p>`; return; }
  if (!box.isConnected) return;
  const d3 = window.d3;
  // Views per map feature (numeric ISO id; Kosovo has none in world-atlas, so match it by name)
  const views = new Map(), names = new Map();
  for (const x of stats) {
    const id = (x.id || '').toUpperCase().slice(0, 2);
    const key = id === 'XK' ? 'Kosovo' : ISO_A2_TO_NUM[id];
    if (!key) continue;
    views.set(key, (views.get(key) || 0) + (x.count || 0)); names.set(key, x.name || id);
  }
  const countries = window.topojson.feature(WORLD, WORLD.objects.countries).features.filter(f => f.properties.name !== 'Antarctica');
  const keyOf = f => f.id || f.properties.name;
  const max = Math.max(1, ...views.values());
  // Sequential single-hue ramp from the site palette: pale blue to deep ocean
  const color = d3.scaleSequentialSqrt(d3.interpolateLab(cssVar('--ramp-lo'), cssVar('--ramp-hi'))).domain([1, max]);
  const EMPTY = cssVar('--map-empty');
  const draw = () => {
    const W = box.clientWidth || 800, H = Math.round(W * 0.5);
    const projection = d3.geoEqualEarth().fitExtent([[4, 4], [W - 4, H - 4]], { type: 'Sphere' });
    const path = d3.geoPath(projection);
    box.innerHTML = '';
    const svg = d3.select(box).append('svg').attr('viewBox', `0 0 ${W} ${H}`).attr('width', '100%').attr('height', H);
    svg.append('path').datum({ type: 'Sphere' }).attr('d', path).attr('fill', cssVar('--map-sphere')).attr('stroke', cssVar('--subtle'));
    const tip = $('#gc-map-tip');
    svg.append('g').selectAll('path').data(countries).join('path')
      .attr('d', path)
      .attr('fill', f => views.has(keyOf(f)) ? color(views.get(keyOf(f))) : EMPTY)
      .attr('stroke', cssVar('--map-border')).attr('stroke-width', 0.6)
      .style('cursor', f => views.has(keyOf(f)) ? 'pointer' : 'default')
      .on('mousemove', (ev, f) => {
        const n = views.get(keyOf(f)) || 0;
        tip.innerHTML = `<b>${esc(names.get(keyOf(f)) || f.properties.name)}</b><span>${n ? fmtN(n) + ' page view' + (n > 1 ? 's' : '') : 'No visits'}</span>`;
        tip.hidden = false;
        const card = box.parentElement.getBoundingClientRect();
        const x = ev.clientX - card.left, y = ev.clientY - card.top;
        tip.style.left = Math.max(8, Math.min(x + 14, card.width - tip.offsetWidth - 8)) + 'px'; tip.style.top = (y - tip.offsetHeight - 10) + 'px';
        d3.select(ev.currentTarget).attr('stroke', cssVar('--ink')).attr('stroke-width', 1.2).raise();
      })
      .on('mouseleave', ev => { tip.hidden = true; d3.select(ev.currentTarget).attr('stroke', cssVar('--map-border')).attr('stroke-width', 0.6); });
  };
  draw();
  // Legend: gradient over the real range, plus the "no visits" swatch
  const lg = $('#gc-legend');
  if (lg) lg.innerHTML = `<span class="lg-swatch" style="background:${EMPTY}"></span><span>No visits</span>
    <span class="lg-ramp" style="background:linear-gradient(90deg, ${[0, .25, .5, .75, 1].map(t => color(1 + t * (max - 1))).join(',')})"></span>
    <span>1</span><span>–</span><span>${fmtN(max)}</span><span>views</span>`;
  window.onresize = () => { clearTimeout(renderVisitorMap._t); renderVisitorMap._t = setTimeout(() => { if ($('#gc-map')) draw(); }, 200); };
}
function bars(items) {
  items = items.filter(x => x.n != null); if (!items.length) return '<p class="hint">No data in this period.</p>';
  const max = Math.max(...items.map(x => Number(x.n) || 0), 1);
  return `<div class="bars">${items.map(x => `<div class="bar"><div class="name" title="${esc(x.name)}">${esc(x.name)}</div><div class="track"><div class="fill" style="width:${(Number(x.n) / max * 100).toFixed(1)}%"></div></div><div class="n">${fmtN(x.n)}</div></div>`).join('')}</div>`;
}
function sparkline(days, vals) {
  if (!vals.length) return '<p class="hint">No data in this period.</p>';
  const W = 800, H = 160, padL = 36, padB = 22, padT = 8;
  const max = Math.max(...vals, 1), n = vals.length;
  const x = i => padL + (n === 1 ? 0 : i * (W - padL - 8) / (n - 1));
  const y = v => padT + (H - padT - padB) * (1 - v / max);
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const area = `M${x(0).toFixed(1)},${y(0)} L${pts.replace(/ /g, ' L')} L${x(n - 1).toFixed(1)},${y(0)} Z`;
  const ticks = [0, Math.round(max / 2), max];
  const labelEvery = Math.ceil(n / 6);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Daily page views">
    ${ticks.map(t => `<line x1="${padL}" x2="${W - 8}" y1="${y(t)}" y2="${y(t)}" style="stroke:var(--subtle)" stroke-dasharray="2 4"/><text x="${padL - 6}" y="${y(t) + 4}" font-size="13" text-anchor="end" style="fill:var(--muted)" font-family="DM Sans, sans-serif">${t}</text>`).join('')}
    <path d="${area}" style="fill:var(--accent-light)" fill-opacity="0.15"/>
    <polyline points="${pts}" fill="none" style="stroke:var(--accent)" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${x(n - 1)}" cy="${y(vals[n - 1])}" r="3.5" style="fill:var(--accent)"/>
    ${days.map((d, i) => i % labelEvery === 0 || i === n - 1 ? `<text x="${x(i)}" y="${H - 6}" font-size="13" text-anchor="${i === n - 1 && n > 1 ? 'end' : i === 0 ? 'start' : 'middle'}" style="fill:var(--muted)" font-family="DM Sans, sans-serif">${d.slice(5)}</text>` : '').join('')}
  </svg>`;
}

// ─────────────────────────────────────────────────────────────────────────────
// Boot
// ─────────────────────────────────────────────────────────────────────────────
$('#btn-save').onclick = saveContent;
$('#btn-signout').onclick = () => (TOKEN ? signOut() : showLogin().then(loadContent));
$('#btn-reload').onclick = async () => { if (isDirty() && !$('#btn-reload').dataset.confirm) { $('#btn-reload').dataset.confirm = '1'; $('#btn-reload').textContent = 'Discard changes & reload?'; setTimeout(() => { $('#btn-reload').dataset.confirm = ''; $('#btn-reload').textContent = 'Reload from GitHub'; }, 3000); return; } $('#btn-reload').dataset.confirm = ''; $('#btn-reload').textContent = 'Reload from GitHub'; await loadContent(); };
window.addEventListener('beforeunload', e => { if (isDirty()) { e.preventDefault(); e.returnValue = ''; } });
// Drag and drop: the smallest container holding exactly one file input is the drop zone for that input
(() => {
  let zoneEl = null, depth = 0;
  const hasFiles = e => [...(e.dataTransfer?.types || [])].includes('Files');
  const zoneOf = target => {
    // climb while the container still holds exactly one file input; the largest such container is the zone
    let best = null;
    for (let el = target instanceof Element ? target : target?.parentElement; el && el !== document.body && !el.matches('main, .content, aside'); el = el.parentElement) {
      const ins = [...el.querySelectorAll('input[type="file"]')].filter(x => !x.disabled);
      if (ins.length === 1) best = { el, input: ins[0] };
      else if (ins.length > 1) break;
      if (best && el.matches('.item, .card, .draft-card')) break;   // a place editor or a settings card is the largest zone
    }
    return best;
  };
  const accepts = (input, f) => {
    const acc = (input.accept || '').split(',').map(x => x.trim().toLowerCase()).filter(Boolean); if (!acc.length) return true;
    const name = f.name.toLowerCase(), type = (f.type || '').toLowerCase();
    return acc.some(a => a.startsWith('.') ? name.endsWith(a) : a.endsWith('/*') ? type.startsWith(a.slice(0, -1)) : type === a);
  };
  const label = input => /pdf/.test(input.accept) ? 'Drop the PDF to upload' : input.multiple ? 'Drop photos to upload' : 'Drop the image to upload';
  const setZone = z => {
    if (zoneEl && (!z || z.el !== zoneEl)) { zoneEl.classList.remove('drop-on'); zoneEl.removeAttribute('data-drop-label'); zoneEl = null; }
    if (z && z.el !== zoneEl) { zoneEl = z.el; zoneEl.classList.add('drop-on'); zoneEl.setAttribute('data-drop-label', label(z.input)); }
  };
  window.addEventListener('dragenter', e => { if (!hasFiles(e)) return; depth++; });
  window.addEventListener('dragleave', e => { if (!hasFiles(e)) return; depth = Math.max(0, depth - 1); if (!depth) setZone(null); });
  window.addEventListener('dragover', e => {
    if (!hasFiles(e)) return; e.preventDefault();
    const z = zoneOf(e.target); setZone(z); e.dataTransfer.dropEffect = z ? 'copy' : 'none';
  });
  window.addEventListener('drop', e => {
    if (!hasFiles(e)) return; e.preventDefault(); depth = 0;
    const z = zoneOf(e.target); setZone(null); if (!z) return;
    let files = [...e.dataTransfer.files].filter(f => accepts(z.input, f));
    const skipped = e.dataTransfer.files.length - files.length;
    if (!files.length) { toast(/pdf/.test(z.input.accept) ? 'Only a PDF can be uploaded here.' : 'Only image files can be uploaded here.', true); return; }
    if (!z.input.multiple) files = files.slice(0, 1);
    const dt = new DataTransfer(); files.forEach(f => dt.items.add(f));
    z.input.files = dt.files; z.input.dispatchEvent(new Event('change', { bubbles: true }));
    if (skipped) toast(`${skipped} file${skipped === 1 ? ' was' : 's were'} skipped (not ${/pdf/.test(z.input.accept) ? 'a PDF' : 'an image'}).`);
  });
})();
(async () => {
  TAB = lsGet(LS.tab) || 'overview';
  await ensureSignedIn();
  await loadContent();
})();
