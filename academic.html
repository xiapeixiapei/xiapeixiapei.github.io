<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="site-fonts.js"></script>
<script src="site-theme.js"></script>
<script src="city-icons.js"></script>
<meta name="description" content="Conferences and academic visits, shown on a map.">
<title>Academic footprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" crossorigin="">
<style>
  /* Private travel map: everything on this page is decrypted in the browser with the travel password.
     Same Deep-ocean palette as the rest of the site. */
  :root {
    /* Theme tokens (dark values below, under html[data-theme="dark"]) */
    --on-accent: #ffffff; --on-accent-2: #a9c8f0; --ink-2: #334155; --highlight-2: #eaf1fb; --hover-border: #b9cbe3; --card-2: #fbfcfe; --hint: #d3dce7;
    --paper-rgb: 245, 247, 250; --card-rgb: 255, 255, 255; --accent-rgb: 27, 79, 138; --accent-light-rgb: 59, 125, 216; --cover-a: #1b4f8a; --cover-b: #0f3360; --highlight-rgb: 214, 227, 245; --subtle-rgb: 211, 220, 231;
    --warn: #8a5300; --warn-bg: #fcefd6; --ok: #2f7a4f; --ok-bg: #e6f3ea; --ok-border: #b7dcc3; --err: #b42318;
    --note-bg: #c8dbf5; --note-fg: #174a85; --badge-blue: #2f74e0; --gold: #b8860b; --tip-sub: #c9dbf3;
    --map-bg: #e9eef5; --map-ring: #ffffff; --map-dot: #1b4f8a; --map-line: #1b4f8a; --net-node: #9db4d0;
    --ramp-lo: #cfe0f5; --ramp-hi: #0f3360; --map-empty: #e6ebf2; --map-sphere: #f7f9fc; --map-border: #ffffff;
    --font-head: 'Source Serif 4', 'Noto Serif SC', Georgia, serif; --font-body: 'Source Sans 3', 'Noto Sans SC', system-ui, sans-serif;

    --ink: #0d1b2a; --paper: #f5f7fa; --accent: #1b4f8a; --accent-light: #3b7dd8;
    --subtle: #d3dce7; --muted: #647387; --highlight: #d6e3f5; --card-bg: #ffffff;
    --shadow: rgba(13, 27, 42, 0.06);
  }

  /* Dark theme: deep blue-black paper, light ink, a lighter ocean blue for links and accents */
  html[data-theme="dark"] {
    --ink: #e3e9f1; --ink-2: #c5cfdb; --paper: #0e141c; --paper-rgb: 14, 20, 28;
    --accent: #8fb9ef; --accent-light: #6fa3e6; --accent-rgb: 143, 185, 239; --accent-light-rgb: 111, 163, 230; --subtle: #2a3747; --subtle-rgb: 42, 55, 71; --muted: #97a5b7;
    --highlight: #1c2d44; --highlight-rgb: 28, 45, 68; --highlight-2: #172438;
    --card-bg: #151e2a; --card: #151e2a; --card-2: #18222f; --card-rgb: 21, 30, 42; --hint: #53657c; --shadow: rgba(0, 0, 0, 0.35);
    --on-accent: #0b1320; --on-accent-2: #1f3d63; --hover-border: #3d5675;
    --warn: #f0c46a; --warn-bg: #3a2d12; --ok: #7fcf9e; --ok-bg: #16301f; --ok-border: #2f5a3f; --err: #ff8f80; --err-bg: #3d1915;
    --note-bg: #22395a; --note-fg: #b5d0f4; --badge-blue: #3d84ea; --gold: #e0b347; --tip-sub: #475a72;
    --map-bg: #131b25; --map-ring: #0e141c; --map-dot: #8fb9ef; --map-line: #8fb9ef; --net-node: #4a6585;
    --ramp-lo: #1f3049; --ramp-hi: #a9cdf7; --map-empty: #1a2330; --map-sphere: #111923; --map-border: #0e141c;
    color-scheme: dark;
  }
  html[data-theme="dark"] img.logo-on-dark, html[data-theme="dark"] .school-logo { background: #f5f7fa; }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--font-body); background: var(--paper); color: var(--ink); line-height: 1.7; -webkit-font-smoothing: antialiased; min-height: 100vh; }
  body.zh { font-family: var(--font-body); }
  a { color: var(--accent); }
  button { font: inherit; color: inherit; cursor: pointer; }
  [hidden] { display: none !important; }

  /* Top bar (same as the publications page) */
  .top-bar { position: sticky; top: 0; z-index: 40; backdrop-filter: blur(16px); background: rgba(var(--paper-rgb), 0.88); border-bottom: 1px solid var(--subtle); }
  .top-bar-inner { max-width: 1100px; margin: 0 auto; padding: 0 2rem; height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .back-link { display: inline-flex; align-items: center; gap: 0.5rem; text-decoration: none; color: var(--accent); font-family: 'Pinyon Script', cursive; font-size: 1.68rem; white-space: nowrap; }
  .back-arrow { font-family: var(--font-body); font-size: 1.1rem; }
  .bar-right { display: flex; align-items: center; gap: 0.9rem; }
  .lang-toggle { display: flex; border: 1px solid var(--subtle); border-radius: 100px; overflow: hidden; }
  .lang-btn { border: none; background: none; padding: 0.25rem 0.75rem; font-size: 0.85rem; color: var(--muted); font-weight: 500; }
  .lang-btn.active { background: var(--accent); color: var(--on-accent); }
  .icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border: 1px solid var(--subtle); border-radius: 100px; background: var(--card-bg); color: var(--muted); transition: all 0.2s; }
  .icon-btn:hover { color: var(--accent); border-color: var(--accent); }
  .icon-btn svg { width: 15px; height: 15px; }

  /* Password gate */
  .gate { min-height: calc(100vh - 60px); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 16px; }
  .gate-card { width: 100%; max-width: 420px; background: var(--card-bg); border: 1px solid var(--subtle); border-radius: 12px; padding: 2rem 2rem 1.5rem; box-shadow: 0 12px 40px var(--shadow); }
  .gate-icon { width: 48px; height: 48px; border-radius: 100px; background: var(--highlight); color: var(--accent); display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; }
  .gate-icon svg { width: 22px; height: 22px; }
  .gate h1 { font-family: var(--font-head); font-weight: 400; font-size: 1.9rem; text-align: center; margin-bottom: 0.3rem; }
  body.zh .gate h1 { font-family: var(--font-head); }
  .gate p.lead { color: var(--muted); text-align: center; font-size: 0.95rem; margin-bottom: 1.3rem; }
  .gate label { display: block; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.3rem; }
  .gate input[type=password] { width: 100%; padding: 0.6rem 0.75rem; border: 1px solid var(--subtle); border-radius: 6px; font: inherit; background: var(--card-bg); }
  .gate input:focus { outline: 2px solid var(--accent-light); outline-offset: 1px; }
  .check { display: flex; align-items: center; gap: 0.45rem; margin: 0.8rem 0 1rem; font-size: 0.92rem; cursor: pointer; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; padding: 0.6rem 1.1rem; border-radius: 6px; border: 1.5px solid var(--accent); background: var(--accent); color: var(--on-accent); font-weight: 600; transition: all 0.2s; text-decoration: none; }
  .btn:hover { background: var(--card-bg); color: var(--accent); }
  .btn:disabled { opacity: 0.6; cursor: wait; }
  .btn.block { width: 100%; }
  .btn.ghost { background: transparent; color: var(--accent); }
  .btn.ghost:hover { background: var(--accent); color: var(--on-accent); }
  .gate-msg { min-height: 1.4em; margin-top: 0.7rem; text-align: center; font-size: 0.92rem; color: var(--err); }
  .gate-foot { margin-top: 1.4rem; font-size: 0.9rem; color: var(--muted); text-align: center; }

  /* Page */
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 2rem; }
  .hero { padding: 2.6rem 0 1.4rem; display: flex; align-items: flex-end; justify-content: space-between; gap: 2rem; flex-wrap: wrap; }
  .hero h1 { font-family: var(--font-head); font-weight: 300; font-size: 2.6rem; line-height: 1.15; }
  body.zh .hero h1 { font-family: var(--font-head); font-weight: 300; }
  .hero h1 em { font-style: italic; color: var(--accent); }
  .hero .intro { color: var(--muted); margin-top: 0.5rem; max-width: 620px; font-size: 1.05rem; }
  .stats { display: flex; gap: 2rem; }
  .stat { text-align: center; }
  .stat-num { display: block; font-family: var(--font-head); font-size: 2.1rem; font-weight: 600; color: var(--accent); line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  body.zh .stat-label { letter-spacing: 0.1em; }

  #map { width: 100%; height: 62vh; min-height: 380px; border-radius: 12px; border: 1px solid var(--subtle); background: var(--map-bg); box-shadow: 0 6px 24px var(--shadow); z-index: 1; }
  .leaflet-container { font-family: inherit; }
  .leaflet-tile-pane { filter: grayscale(0.55) saturate(0.85) brightness(1.04) contrast(0.95); }
  html[data-theme="dark"] .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) grayscale(0.5) brightness(0.82) contrast(0.92); }
  .leaflet-interactive.fp-city { stroke: var(--map-ring); fill: var(--map-dot); transition: fill 0.2s; }
  .leaflet-interactive.fp-city:hover { fill: var(--accent-light); }
  .leaflet-interactive.fp-sight { stroke: var(--map-ring); fill: var(--accent-light); }
  .leaflet-interactive.fp-area { stroke: var(--map-line); fill: var(--accent-light); }
  .leaflet-interactive.fp-prov { stroke: var(--map-line); }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--card-bg); color: var(--ink); }
  .leaflet-tooltip { background: var(--card-bg); color: var(--ink); border-color: var(--subtle); }
  .leaflet-tooltip-top::before { border-top-color: var(--card-bg); }
  .leaflet-tooltip-bottom::before { border-bottom-color: var(--card-bg); }
  .leaflet-tooltip-left::before { border-left-color: var(--card-bg); }
  .leaflet-tooltip-right::before { border-right-color: var(--card-bg); }
  .leaflet-bar a, .leaflet-bar a:hover { background-color: var(--card-bg); color: var(--ink); border-bottom-color: var(--subtle); }
  .leaflet-bar { border-color: var(--subtle) !important; }
  .leaflet-container .leaflet-control-attribution { background: rgba(var(--paper-rgb), 0.8); color: var(--muted); }
  .leaflet-container a.leaflet-popup-close-button { color: var(--muted); }
  .leaflet-popup-content-wrapper { border-radius: 8px; box-shadow: 0 8px 24px rgba(13,27,42,0.18); }
  .leaflet-popup-content { margin: 0.8rem 1rem; line-height: 1.5; font-size: 0.95rem; }
  .pop-city { font-weight: 600; font-size: 1.05rem; color: var(--ink); }
  .pop-meta { color: var(--muted); font-size: 0.88rem; }
  .pop-btn { margin-top: 0.5rem; display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.25rem 0.7rem; border-radius: 5px; background: var(--accent); color: var(--on-accent); border: 1.5px solid var(--accent); font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  .pop-btn:hover { background: var(--card-bg); color: var(--accent); }
  .map-note { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; color: var(--muted); font-size: 0.85rem; margin: 0.6rem 0.2rem 0; }
  .legend { display: inline-flex; align-items: center; gap: 0.4rem; }
  .legend i { display: inline-block; width: 14px; height: 10px; border-radius: 2px; background: rgba(var(--accent-light-rgb), 0.35); border: 1px solid var(--accent); }
  .legend b { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); border: 2px solid #fff; box-shadow: 0 0 0 1px var(--accent); }

  /* Country sections */
  .places { padding: 2.4rem 0 4rem; }
  .section-title { font-family: var(--font-head); font-weight: 400; font-size: 1.9rem; margin-bottom: 1.4rem; display: flex; align-items: baseline; gap: 0.8rem; }
  body.zh .section-title { font-family: var(--font-head); }
  .section-title small { font-family: var(--font-body); font-size: 0.9rem; color: var(--muted); }
  .country { background: var(--card-bg); border: 1px solid var(--subtle); border-radius: 12px; padding: 1.3rem 1.5rem; margin-bottom: 1rem; scroll-margin-top: 80px; transition: box-shadow 0.3s, border-color 0.3s; }
  .country.flash { border-color: var(--accent); box-shadow: 0 0 0 3px var(--highlight); }
  .country-head { display: flex; align-items: center; gap: 0.7rem; width: 100%; padding: 0.15rem 0; margin: 0; border: none; background: none; font: inherit; color: inherit; text-align: left; cursor: pointer; border-radius: 8px; }
  .country-head:focus-visible { outline: 2px solid var(--accent-light); outline-offset: 4px; }
  .country-head .chev { width: 18px; height: 18px; flex-shrink: 0; color: var(--muted); transition: transform 0.25s ease, color 0.2s; }
  .country.open .country-head .chev { transform: rotate(90deg); color: var(--accent); }
  .country-head:hover h3 { text-decoration: underline; text-decoration-color: var(--subtle); text-underline-offset: 4px; }
  .country:not(.open) .city:not(.hl), .country:not(.open) .prov:not(.has-hl) { display: none; }
  .country:not(.open) .prov.has-hl .prov-head .n { display: none; }
  .country.open .country-more { display: none; }
  .country-more { display: block; margin-top: 0.8rem; padding: 0.45rem 0.9rem; border: 1px dashed var(--subtle); border-radius: 8px; background: transparent; color: var(--accent); font: inherit; font-size: 0.88rem; font-weight: 600; cursor: pointer; }
  .country-more:hover { border-color: var(--accent); background: var(--highlight); }
  .hl-count { display: inline-flex; align-items: center; gap: 0.2rem; font-size: 0.8rem; font-weight: 700; color: var(--gold); }
  .hl-star { width: 15px; height: 15px; color: var(--gold); flex-shrink: 0; }
  .city.hl { border-color: rgba(var(--accent-light-rgb), 0.45); }
  .prov { margin-top: 1rem; padding-left: 0.9rem; border-left: 2px solid var(--subtle); }
  .prov .city:first-of-type { margin-top: 0.5rem; }
  .prov-head { display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap; }
  .prov-head .prov-name { font-family: var(--font-head); font-weight: 600; font-size: 1.08rem; color: var(--ink); }
  .prov-head .prov-en { font-size: 0.82rem; color: var(--muted); }
  .prov-head .n { margin-left: auto; font-size: 0.82rem; color: var(--muted); }
  .flag { font-size: 1.6rem; line-height: 1; display: inline-flex; align-items: center; }
  .flag-img { height: 20px; width: auto; border-radius: 3px; box-shadow: 0 0 0 1px rgba(13, 27, 42, 0.12); vertical-align: -3px; }
  .leaflet-tooltip .flag-img { height: 14px; vertical-align: -2px; margin-right: 2px; }
  .country-head h3 { font-family: var(--font-head); font-weight: 600; font-size: 1.35rem; color: var(--accent); }
  body.zh .country-head h3 { font-family: var(--font-head); }
  .country-head .n { color: var(--muted); font-size: 0.88rem; margin-left: auto; white-space: nowrap; }
  .city { position: relative; display: grid; grid-template-columns: 1fr auto; gap: 0.9rem 1.5rem; padding: 1.1rem 1.3rem 1.1rem 1.5rem; margin-top: 0.8rem; align-items: center; background: linear-gradient(135deg, var(--card-2) 0%, var(--card-bg) 60%); border: 1px solid var(--subtle); border-radius: 10px; transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease; }
  .city-ic { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 8px; background: var(--highlight); color: var(--accent); flex-shrink: 0; transition: transform 0.35s cubic-bezier(.34,1.56,.64,1), background 0.25s, color 0.25s; }
  .city-ic svg { width: 18px; height: 18px; }
  /* Map markers: round pin with the city icon */
  .fp-pin-wrap { background: none; border: none; }
  .fp-pin { display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 50%; background: var(--map-dot); color: var(--on-accent, #fff); border: 2px solid var(--map-ring); box-shadow: 0 2px 6px rgba(13, 27, 42, 0.25); transition: transform 0.15s ease, background 0.2s; cursor: pointer; }
  .fp-pin svg { width: 18px; height: 18px; }
  .fp-pin:hover, .leaflet-marker-icon:hover .fp-pin { transform: scale(1.15); background: var(--accent-light); }
  .fp-pin.hl { box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.25), 0 2px 6px rgba(13, 27, 42, 0.25); }
  /* Zoomed out: smaller pins so neighbouring cities overlap less */
  .z-low .fp-pin { width: 22px; height: 22px; margin: 4px; }
  .z-low .fp-pin svg { width: 13px; height: 13px; }
  .city-ic-lived { background: var(--ok-bg); color: var(--ok); }
  .visits-n { font-weight: 700; font-size: 0.78rem; color: var(--on-accent); background: var(--accent-light); padding: 0.05rem 0.45rem; border-radius: 100px; letter-spacing: 0.02em; }
  /* Scroll reveal: cards rise in as they enter the viewport */
  .js-reveal .city { opacity: 0; transform: translateY(22px) scale(0.985); }
  .js-reveal .city.in { opacity: 1; transform: none; transition: opacity 0.55s ease var(--d, 0s), transform 0.6s cubic-bezier(.22,1,.36,1) var(--d, 0s), box-shadow 0.25s ease, border-color 0.25s ease; }
  .js-reveal .city.in.settled { transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease; }
  .city::before { content: ''; position: absolute; left: 0; top: 14%; bottom: 14%; width: 4px; border-radius: 0 4px 4px 0; background: var(--accent-light); transform: scaleY(0); transform-origin: center; transition: transform 0.3s ease; }
  .city .city-name > span:first-child, .city .city-title { transition: color 0.25s; }
  /* Touch screens: the card in the middle of the screen is lifted while you scroll, and cards give way under the finger */
  @media (hover: none) {
    .city.focus { box-shadow: 0 10px 26px rgba(13, 27, 42, 0.10); border-color: var(--hover-border); }
    .city.focus::before { transform: scaleY(1); }
    .city.focus .city-title { color: var(--accent); }
    .city.focus .city-ic { transform: scale(1.12) rotate(-6deg); background: var(--accent); color: var(--on-accent); }
    .city.focus .city-ic-lived { background: var(--ok); }
    .city:active { transform: scale(0.985) !important; }
  }
  @media (hover: hover) and (pointer: fine) {
    .city:hover .city-ic { transform: scale(1.12) rotate(-6deg); background: var(--accent); color: var(--on-accent); }
    .city:hover .city-ic-lived { background: var(--ok); }
    .city:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(13, 27, 42, 0.10); border-color: var(--hover-border); }
    .city:hover::before { transform: scaleY(1); }
    .city:hover .city-title { color: var(--accent); }
    .city:hover .strip .ph img.ready { transform: scale(1.04); }
    .city .strip .ph:hover img.ready { transform: scale(1.1); }
    .city:hover .sight { border-color: var(--hover-border); }
  }
  .city-name { font-weight: 600; font-size: 1.08rem; display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
  .city-name .when { font-weight: 500; color: var(--muted); font-size: 0.86rem; background: var(--highlight); padding: 0.05rem 0.55rem; border-radius: 100px; }
  .city-note { color: var(--muted); font-size: 0.95rem; margin-top: 0.15rem; }
  .city-event { color: var(--accent); font-weight: 500; margin-top: 0.1rem; }
  .city-talk { font-family: var(--font-head); font-style: italic; font-size: 1.02rem; color: var(--ink); margin-top: 0.1rem; }
  .talk-type { font-family: var(--font-body); font-style: normal; font-size: 0.82rem; font-weight: 600; color: var(--accent); margin-right: 0.45rem; text-transform: uppercase; letter-spacing: 0.04em; }
  body.zh .talk-type { font-family: var(--font-body); letter-spacing: 0.1em; }
  body.zh .city-talk { font-family: var(--font-head); font-style: normal; }
  .city-name .role { font-weight: 600; color: var(--on-accent); background: var(--accent); font-size: 0.78rem; padding: 0.05rem 0.55rem; border-radius: 100px; letter-spacing: 0.03em; }
  .city-name .role.trip { color: var(--accent); background: var(--card-bg); box-shadow: inset 0 0 0 1.5px var(--accent); }
  .city-name .role.trip-lived { color: var(--on-accent); background: var(--ok); box-shadow: none; }
  .city-actions { display: flex; gap: 0.5rem; align-items: center; }
  .small-btn { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.3rem 0.8rem; border-radius: 5px; border: 1.5px solid var(--accent); background: var(--accent); color: var(--on-accent); font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; transition: all 0.2s; }
  .small-btn:hover { background: var(--card-bg); color: var(--accent); }
  .small-btn.ghost { background: transparent; color: var(--accent); }
  .small-btn.ghost:hover { background: var(--accent); color: var(--on-accent); }
  .small-btn svg { width: 14px; height: 14px; }
  .strip { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 0.6rem; }
  /* Sights and landmarks visited in a place */
  .highlights { margin-top: 0.6rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .sights { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; }
  .sights-label { display: inline-flex; align-items: center; gap: 0.3rem; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ok); margin-right: 0.2rem; }
  .sights-label svg { width: 15px; height: 15px; }

    POP.wired = true;
    POP.el.addEventListener('mouseenter', () => clearTimeout(POP.hide));
    POP.el.addEventListener('mouseleave', () => popClose());
    document.addEventListener('click', e => { if (POP.chip && !e.target.closest('.sg-pop') && !e.target.closest('.sight.has-photos')) popClose(true); });
    window.addEventListener('scroll', () => { if (POP.chip) { if (matchMedia('(hover: none)').matches) popClose(true); else popPlace(); } }, { passive: true });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && POP.chip) popClose(true); });
  }
}

// ── Lightbox ──
let LB = null;
async function openLightbox(pid, i, sid) {
  const p = placeById(pid); if (!p || !(p.photos || []).length) return;
  const list = sid ? sightPhotos(p, sid) : p.photos; if (!list.length) return;
  const sg = sid ? (p.sights || []).find(g => g.id === sid) : null;
  LB = { p, i, list, sg };
  $('#lb-root').innerHTML = `<div class="lb" role="dialog" aria-modal="true">
    <span class="lb-count" id="lb-count"></span>
    <button class="lb-x" id="lb-x" aria-label="Close">✕</button>
    ${list.length > 1 ? '<button class="lb-prev" id="lb-prev" aria-label="Previous">‹</button><button class="lb-next" id="lb-next" aria-label="Next">›</button>' : ''}
    <div class="spinner" id="lb-spin"></div>
    <img id="lb-img" alt="">
    <div class="lb-cap" id="lb-cap"></div></div>`;
  $('#lb-x').onclick = closeLightbox;
  if ($('#lb-prev')) { $('#lb-prev').onclick = () => stepLightbox(-1); $('#lb-next').onclick = () => stepLightbox(1); }
  $('.lb').onclick = e => { if (e.target === e.currentTarget) closeLightbox(); };
  document.body.style.overflow = 'hidden';
  showLightbox();
}
async function showLightbox() {
  const { p, i, list, sg } = LB; const ph = list[i];
  const img = $('#lb-img'), spin = $('#lb-spin'); img.classList.remove('ready'); spin.hidden = false;
  $('#lb-count').textContent = `${i + 1} / ${list.length}`;
  $('#lb-cap').innerHTML = `<b>${sg ? esc(t(sg.name)) + ' · ' : ''}${esc(t(p.city))}${p.when && !sg ? ', ' + esc(fmtWhen(p.when)) : ''}</b>${esc(t(ph.caption))}`;
  try {
    // Thumbnail first (usually cached), then the full-size image
    if (URLS.has(ph.thumb)) { img.src = await photoUrl(ph.thumb); img.classList.add('ready'); }
    const url = await photoUrl(ph.full);
    if (LB && LB.p === p && LB.i === i && LB.list === list) { img.src = url; img.onload = () => { img.classList.add('ready'); spin.hidden = true; }; }
  } catch (e) { spin.hidden = true; $('#lb-cap').textContent = (LANG === 'zh' ? '照片无法加载：' : 'Could not load this photo: ') + e.message; }
  // Prefetch neighbours
  [i + 1, i - 1].forEach(j => { const q = list[j]; if (q) photoUrl(q.full).catch(() => {}); });
}
function stepLightbox(d) { if (!LB) return; const n = LB.list.length; LB.i = (LB.i + d + n) % n; showLightbox(); }
function closeLightbox() { LB = null; $('#lb-root').innerHTML = ''; document.body.style.overflow = ''; }
document.addEventListener('keydown', e => { if (!LB) return; if (e.key === 'Escape') closeLightbox(); if (e.key === 'ArrowRight') stepLightbox(1); if (e.key === 'ArrowLeft') stepLightbox(-1); });

// ── Language ──
function applyLang(lang) {
  LANG = lang;
  document.querySelectorAll('#lang-toggle .lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  document.body.classList.toggle('zh', lang === 'zh');
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.querySelectorAll('[data-en][data-zh]').forEach(el => { el.textContent = el.getAttribute('data-' + lang); });
  document.querySelectorAll('[data-tip-en]').forEach(el => { el.title = el.getAttribute('data-tip-' + lang); });
  document.title = (PRIVATE ? (lang === 'zh' ? '旅行足迹' : 'Travel') : (lang === 'zh' ? '学术足迹' : 'Academic footprint')) + (window.SITE_OWNER?.[lang] ? ' | ' + window.SITE_OWNER[lang] : '');
  if (DATA && !$('#app').hidden) { renderHeader(); renderList(); renderMap(); }
}
$('#lang-toggle').addEventListener('click', e => { const b = e.target.closest('.lang-btn'); if (b && b.dataset.lang !== LANG) applyLang(b.dataset.lang); });

function showApp() {
  $('#gate').hidden = true; $('#app').hidden = false; $('#btn-lock').hidden = !PRIVATE;
  renderHeader(); renderList(); renderMap();
}
(async () => {
  if (!PRIVATE) {
    // Public page: load the plain JSON and render straight away
    $('#gate-msg').textContent = ''; $('#f-gate').hidden = true; $('.gate-foot').hidden = true;
    $('.gate p.lead').textContent = LANG === 'zh' ? '加载中…' : 'Loading…';
    try { DATA = await fetchTravelFile(); showApp(); }
    catch (e) { $('.gate p.lead').textContent = e.message; }
    return;
  }
  if (await tryStoredKey()) showApp(); else $('#pw').focus();
})();
</script>
<script>
// Owner name for the back link, footer and tab title (from content.json)
fetch('content.json', { cache: 'no-cache' }).then(r => r.json()).then(c => {
  const p = c.profile || {}; window.SITE_OWNER = { en: p.name_en || '', zh: p.name_zh || p.name_en || '' };
  document.querySelectorAll('.site-owner').forEach(el => { el.textContent = p.name_en || ''; });
  const lang = typeof LANG !== 'undefined' ? LANG : 'en', o = window.SITE_OWNER[lang];
  if (typeof PRIVATE !== 'undefined') document.title = (PRIVATE ? (lang === 'zh' ? '旅行足迹' : 'Travel') : (lang === 'zh' ? '学术足迹' : 'Academic footprint')) + (o ? ' | ' + o : '');
}).catch(() => {});
</script>
